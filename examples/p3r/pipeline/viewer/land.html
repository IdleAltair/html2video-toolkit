<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圈地 · LAND GRAB</title>
<style>
:root{color-scheme:dark;--muted:#a8c0ff;--line:#2f4fd8;--accent:#58f8f8}
*{box-sizing:border-box}
body{margin:0;background:#0a1030;color:#f2f6ff;font:15px 'Segoe UI','Microsoft YaHei',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 30px;border-bottom:1px solid var(--line)}
h1{font-size:23px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;color:var(--accent);margin-left:14px;letter-spacing:.16em}
.meta{color:var(--muted);font-size:13px}
.wrap{max-width:1340px;margin:auto;padding:20px 30px;display:grid;grid-template-columns:minmax(420px,1fr) 300px;gap:22px}
.arena{background:#0e1a52;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);letter-spacing:.08em}
canvas{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;padding:10px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.controls{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.controls input[type=range]{flex:1}
button,select{background:#16307f;color:#f2f6ff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
button:hover{background:#1d3ea3}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:#0e1a52;border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font-size:11px;letter-spacing:.18em;color:var(--accent);margin-bottom:10px}
.player{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(47,79,216,.5)}
.player:last-child{border-bottom:0}
.avatar{width:34px;height:34px;border-radius:9px;overflow:hidden;background:#0d1730;display:flex;align-items:center;justify-content:center;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted)}
.score{font-family:Consolas,monospace;font-size:17px;font-weight:700}
.events{height:170px;overflow:hidden;font-size:12px;line-height:1.7;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:12px;padding:14px}
.stage header,.stage .controls,.stage .bar,.stage footer,.stage .legend,.stage .sub{display:none}
.stage{height:100vh;overflow:hidden}
.stage .wrap{padding:0;margin:0;max-width:none;grid-template-columns:minmax(0,1fr) 380px;gap:0;height:100vh;align-items:stretch}
.stage .arena{border:0;border-radius:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage .arena canvas{width:min(100%,100vh);height:auto;margin:0}
.stage aside{padding:14px 16px;gap:12px;overflow:hidden}
.stage .player{padding:10px 0;grid-template-columns:44px minmax(0,1fr) auto}
.stage .avatar{width:44px;height:44px}
.stage .events{height:190px}
#guide{display:none}
.stage #guide{display:flex;flex-direction:column;align-items:flex-start;position:fixed;left:26px;top:22px;z-index:9;gap:7px;
 font:600 26px/1.1 'Segoe UI','Microsoft YaHei',sans-serif;letter-spacing:.06em;
 background:rgba(10,16,48,.74);border:1px solid var(--line);border-radius:12px;padding:14px 20px}
.stage #gtt{font-family:Consolas,monospace;font-size:21px;color:var(--accent);letter-spacing:.1em}
.stage .hint{display:none}
</style></head><body>
<header><h1>圈地 <small>LAND GRAB / 02</small></h1><span class="meta" id="meta">确定性回放</span></header>
<div id="guide"><span id="gtag"></span><span id="gtt"></span></div>
<main class="wrap">
<section class="arena">
  <div class="bar"><span id="mode">加载回放</span><span id="counter">TURN 000 / 000</span></div>
  <canvas id="board" width="840" height="840" aria-label="圈地棋盘"></canvas>
  <div class="legend"><span><i class="swatch" style="background:#58f8f8"></i>本机（Qwen3.8-27B）</span><span><i class="swatch" style="background:#ff6b6b"></i>对手</span><span>格子颜色 = 该格归谁圈住；头像 = 当前位置</span></div>
  <div class="controls">
    <input id="seek" type="range" min="0" max="1" value="0" aria-label="回合进度">
    <button id="play">播放</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">重播</button>
    <select id="speed"><option value="8">8 回合/秒</option><option value="20" selected>20 回合/秒</option><option value="40">40 回合/秒</option><option value="80">80 回合/秒</option></select>
  </div>
</section>
<aside>
  <div class="card"><div class="label">PLAYERS / 选手</div><div id="players"></div></div>
  <div class="card"><div class="label">MATCH / 战况</div><div id="status">等待开局</div><div class="sub" id="statusSub"></div></div>
  <div class="card"><div class="label">MOVES / 近几回合</div><div id="events" class="events"></div></div>
  <div class="hint">空格：播放 / 暂停　← →：逐步<br>R：重播　#turn=N：跳到第 N 回合<br>单挑＝两张同图各换一次出生位；混战＝4 人同桌。</div>
</aside>
</main>
<footer>无外部依赖 · 回放中不运行选手代码</footer>
<script>
let data=/*REPLAY_DATA*/null,index=0,playing=false,last=0,acc=0;
const AV=/*AVATARS*/null,PIC={};
const colors=['#58f8f8','#ff6b6b','#ffc21f','#c9a7ff','#7cf07c','#ff9de2','#8fc8ff','#f7f7a0'];
const $=s=>document.getElementById(s);
const cv=$('board'),SS=Math.max(2,Math.ceil((window.devicePixelRatio||1)*2));cv.width=840*SS;cv.height=840*SS;const ctx=cv.getContext('2d');ctx.setTransform(SS,0,0,SS,0,0);
let W=40,H=40,NF=0,OWN=null,TRAIL=null,SPAWNS=[],OX=20,OY=20,C=20,ZOOM=1,CAM=false,CAMX=null,CAMY=null;
function pic(n){if(!AV||!AV[n])return null;if(!PIC[n]){const im=new Image();im.onload=function(){draw()};im.src=AV[n];PIC[n]=im}return PIC[n]}
function shortName(n){return String(n).split(/[\/]/).pop()}
const isMeName=(n)=>/你的 ?bot|your-bot|^bot$/i.test(String(n==null?'':n));
const DISP=(n)=>{const s=String(n==null?'':n).split(/[\/]/).pop();if(isMeName(s))return '本地 27B';const bl=/^baseline#?(\d+)$/i.exec(s);if(bl)return '基准 '+bl[1];if(s.indexOf('@')<0)return s;return s.split('@')[0].split(/[-_]/).map(w=>w?w[0].toUpperCase()+w.slice(1):'').join(' ')||s};
const WB=(i)=>String.fromCharCode(65+i)+'·'+DISP(((data&&data.names)||[])[i]);
function load(d){
  if(!d||!Array.isArray(d.frames)||!d.frames.length||!d.config)throw Error('不是有效的回放');
  data=d;W=d.config.width;H=d.config.height;NF=d.frames.length;
  const cur=new Int8Array(W*H),tr=new Int8Array(W*H),io=d.initial_owner||'';
  cur.fill(-1);tr.fill(-1);
  const N=(d.names||[]).length;
  const trails=[];for(let i=0;i<N;i++)trails.push([]);
  for(let i=0;i<W*H;i++){const ch=io[i]||'.';cur[i]=ch==='.'?-1:Number(ch)}
  OWN=new Int8Array(NF*W*H);TRAIL=new Int8Array(NF*W*H);
  for(let k=0;k<NF;k++){
    const f=d.frames[k];
    for(const t of f.trail_add||[]){trails[t[0]].push(t[1]);tr[t[1]]=t[0]}
    for(const t of f.owner||[]){cur[t[0]]=t[1]}
    for(const i of f.trail_clear||[]){for(const kk of trails[i])tr[kk]=-1;trails[i]=[]}
    OWN.set(cur,k*W*H);TRAIL.set(tr,k*W*H);
  }
  SPAWNS=(d.spawns||[]).map(s=>[s[0],s[1]]);
  C=Math.floor(800/W);OX=Math.round((840-C*W)/2);OY=OX;
  $('seek').max=NF-1;
  const r=d.result||{};
  $('meta').textContent=(d.version||'')+' · SEED '+d.seed+' · '+ (r.mode==='melee'?'4 人混战':'单挑');
  const _g=$('gtag');if(_g)_g.textContent='圈地 · '+data.names.length+' 人'+(r.mode==='melee'?'混战':'单挑');
  const ps=new URLSearchParams(location.hash.slice(1));
  ZOOM=Math.min(4,Math.max(1,Number(ps.get('zoom'))||1));CAM=(ps.get('cam')||'')==='me';
  C=Math.floor(800/W*ZOOM);OX=Math.round((840-C*W)/2);OY=OX;CAMX=null;CAMY=null;
  document.body.classList.toggle('stage',ps.has('stage'));
  const req=Number(ps.get('turn'));
  index=(Number.isFinite(req)&&req>0)?Math.min(NF-1,Math.max(0,req-1)):0;
  playing=false;draw();
}
function areas(fi,out){const base=fi*W*H,cnt={};for(let i=0;i<W*H;i++){const o=OWN[base+i];if(o>=0)cnt[o]=(cnt[o]||0)+1}
  for(let p=0;p<data.names.length;p++)out[p]=cnt[p]||0;return out}
const _tmp=[];
function draw(){
  ctx.clearRect(0,0,840,840);
  const _t=$('gtt');if(_t&&data)_t.textContent='TURN '+String(index+1).padStart(3,'0')+' / '+NF;
  if(!data){ctx.fillStyle='#9aa9be';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('导入回放 JSON 开始观看',420,420);return}
  const base=index*W*H,names=data.names||[],mi=names.findIndex(isMeName);
  if(CAM&&ZOOM>1){
    const p=(data.frames[index].pos||[])[mi];
    if(p){const tx=(p[0]+.5)*C,ty=(p[1]+.5)*C,mw=C*W,mh=C*H;
      OX=mw<=840?(840-mw)/2:Math.min(0,Math.max(840-mw,420-tx));
      OY=mh<=840?(840-mh)/2:Math.min(0,Math.max(840-mh,420-ty));}
  }
  ctx.fillStyle='#0b1546';ctx.fillRect(OX,OY,C*W,C*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=base+y*W+x,o=OWN[k],tl=TRAIL[k];
    const xx=OX+x*C,yy=OY+y*C;
    ctx.fillStyle=((x+y)&1)?'#101c50':'#122052';ctx.fillRect(xx,yy,C,C);
    if(o>=0){ctx.fillStyle=colors[o%colors.length];ctx.globalAlpha=.8;ctx.fillRect(xx,yy,C,C);ctx.globalAlpha=1;
      ctx.fillStyle='rgba(10,16,48,.35)';ctx.fillRect(xx+C-1,yy,1,C);ctx.fillRect(xx,yy+C-1,C,1)}
    if(tl>=0){ctx.fillStyle=colors[tl%colors.length];ctx.fillRect(xx+C*.18,yy+C*.18,C*.64,C*.64);
      ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(1,C*.12);ctx.strokeRect(xx+C*.18,yy+C*.18,C*.64,C*.64)}
  }
  ctx.strokeStyle='#2f4fd8';ctx.lineWidth=2;ctx.strokeRect(OX,OY,C*W,C*H);
  SPAWNS.forEach((s,i)=>{ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=3;ctx.beginPath();ctx.arc(OX+(s[0]+.5)*C,OY+(s[1]+.5)*C,C*.9,0,Math.PI*2);ctx.stroke()});
  const f=data.frames[index];
  (f.pos||[]).forEach((p,i)=>{
    const xx=OX+(p[0]+.5)*C,yy=OY+(p[1]+.5)*C,rad=C*1.15;const me=/你的 ?bot|your-bot/i.test(String(names[i]||''));
    ctx.save();ctx.beginPath();ctx.roundRect(xx-rad,yy-rad,rad*2,rad*2,rad*.35);ctx.clip();
    const im=pic(shortName(names[i]));
    ctx.fillStyle=colors[i%colors.length];ctx.fillRect(xx-rad,yy-rad,rad*2,rad*2);
    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,xx-rad,yy-rad,rad*2,rad*2);
    ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle=colors[i%colors.length];ctx.beginPath();ctx.roundRect(xx-rad,yy-rad,rad*2,rad*2,rad*.35);ctx.stroke();if(me){ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.beginPath();ctx.roundRect(xx-rad*1.32,yy-rad*1.32,rad*2.64,rad*2.64,rad*.45);ctx.stroke()}
    const d0=p[2]||'U',dx={U:0,D:0,L:-1,R:1}[d0]||0,dy={U:-1,D:1,L:0,R:0}[d0]||0;
    ctx.fillStyle='#0a1030';ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(xx+dx*rad*1.5,yy+dy*rad*1.5);
    ctx.lineTo(xx+dx*rad*.9-dy*rad*.55,yy+dy*rad*.9-dx*rad*.55);
    ctx.lineTo(xx+dx*rad*.9+dy*rad*.55,yy+dy*rad*.9+dx*rad*.55);
    ctx.closePath();ctx.fill();ctx.stroke();
  });
  const ar=areas(index,_tmp);
  $('counter').textContent='TURN '+String(index).padStart(3,'0')+' / '+(NF-1);
  const r=data.result||{};
  $('mode').textContent=(r.mode==='melee'?'混战 · ':'单挑 · ')+W+' × '+H+' · '+names.length+' 人';
  const last=index===NF-1;
  $('status').textContent=last?(r.areas&&r.areas[0]===r.areas[1]?'并列结束':'胜负已定'):'进行中';
  if(last&&r.ranks){$('statusSub').textContent=r.ranks.map((rk,i)=>String.fromCharCode(65+i)+' 第 '+rk+' 名 · '+(r.areas?r.areas[i]:'')+' 格').join('　')}
  else{$('statusSub').textContent='本机 '+ar[0]+' 格 · 对手 '+ar.slice(1).join(' / ')+' 格'}
  $('players').replaceChildren();
  names.forEach((n,i)=>{
    const div=document.createElement('div');div.className='player';
    const av=document.createElement('div');av.className='avatar';
    const im=pic(shortName(n));
    if(im){const t=document.createElement('img');t.src=im.src;t.alt='';av.appendChild(t)}
    else{av.style.background=colors[i%colors.length];av.textContent=String.fromCharCode(65+i)}
    const info=document.createElement('div');
    const nm=document.createElement('div');nm.className='name';nm.textContent=String.fromCharCode(65+i)+' · '+DISP(n);
    const sb=document.createElement('div');sb.className='sub';
    sb.textContent=last&&r.ranks?('第 '+r.ranks[i]+' 名'):'场中';
    info.append(nm,sb);
    const sc=document.createElement('div');sc.className='score';sc.style.color=colors[i%colors.length];sc.textContent=ar[i];
    div.append(av,info,sc);$('players').append(div);
  });
  $('events').replaceChildren();
  const lines=[];
  for(let k=Math.max(0,index-40);k<=index;k++){
    const fr=data.frames[k];
    for(const ev of fr.events||[]){
      if(ev.type==='capture')lines.push([k,WB(ev.player)+' 圈住 '+ev.cells+' 格',ev.player]);
      else if(ev.type==='death')lines.push([k,WB(ev.player)+' 撞到轨迹，回出生点',ev.player]);
    }
  }
  for(const [k,t,p] of lines.slice(-12).reverse()){const line=document.createElement('div');line.textContent=k+' · '+t;if(p===mi)line.style.color='#4fe08b';$('events').append(line)}
  if(!lines.length){const line=document.createElement('div');line.textContent=index+' · 尚无圈地，轨迹还在跑';$('events').append(line)}
  $('seek').value=index;$('play').textContent=playing?'暂停':'播放';
}
function step(n){if(!data)return;index=Math.max(0,Math.min(NF-1,index+n));draw()}
function toggle(){if(!data)return;if(index>=NF-1)index=0;playing=!playing;acc=0;draw()}
$('play').onclick=toggle;
$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);
$('reset').onclick=()=>{index=0;playing=false;draw()};
$('seek').oninput=e=>{index=Number(e.target.value);playing=false;draw()};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='r'||e.key==='R'){index=0;playing=false;draw()}
  else if(e.key==='f'||e.key==='F')document.body.classList.toggle('clean');
});
function tick(ts){if(!last)last=ts;const dt=(ts-last)/1000;last=ts;
  if(playing&&data){acc+=dt*Number($('speed').value);
    if(acc>=1){const n=Math.floor(acc);acc-=n;index=Math.min(NF-1,index+n);draw();if(index>=NF-1)playing=false}}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
try{load(data)}catch(err){$('meta').textContent=String(err.message||err)}
</script></body></html>
