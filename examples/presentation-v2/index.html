<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen3.8-27B · 不同量化效果直观对比</title>
<style>
:root{
  --bg:#f4efe3; --ink:#141210; --red:#d93a12;
  --p1:#2b4a9e; --p2:#0e6e68; --p3:#b97a10;
  --mut:#4a4238; --card:#fbf7ec; --faint:rgba(20,18,16,.22);
  --sans:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
/* 全局胶片颗粒（P5R/印刷质感） */
/* 录屏模式（?clean=1）：隐藏鼠标指针（仍可操作） */
html.clean, html.clean * { cursor: none !important; }
body::after{content:"";position:fixed;inset:0;z-index:45;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:2.8vh 3.2vw 5.8vh}
.slide.on{display:flex}
.slide[data-p="1"]{--p:var(--p1)} .slide[data-p="2"]{--p:var(--p2)} .slide[data-p="3"]{--p:var(--p3)}
.slide[data-p="0"]{--p:var(--red)}
.fx{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.9,.24,1)}
.fx.on{opacity:1;transform:none}
.plate{display:inline-flex;align-items:center;gap:.7vw;background:var(--ink);color:var(--bg);
  font-family:var(--mono);font-size:1.7vh;letter-spacing:2px;padding:1vh 1.1vw;width:max-content;
  box-shadow:.55vw .6vh 0 var(--p);transform:rotate(-1.2deg)}
.plate i{width:1.2vh;height:1.2vh;background:var(--red);flex:none}
.plate.sm{font-size:1.4vh;padding:.7vh .9vw}
.ghost{position:absolute;font-family:var(--mono);font-weight:700;font-size:27vh;line-height:1;color:transparent;
  -webkit-text-stroke:2.5px var(--p);opacity:.42;user-select:none;z-index:0;pointer-events:none;transform:rotate(-2deg)}
.xm{position:absolute;width:1.6vh;height:1.6vh;z-index:5;pointer-events:none}
.xm::before,.xm::after{content:"";position:absolute;background:rgba(20,18,16,.4)}
.xm::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
.xm::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
.xm.tl{top:1.6vh;left:1.6vw}.xm.tr{top:1.6vh;right:1.6vw}.xm.bl{bottom:5.2vh;left:1.6vw}.xm.br{bottom:5.2vh;right:1.6vw}

/* ===== 每页自适应背景系统（密度低=丰富 / 密度高=克制；对角贯穿 + 动态圆组件） ===== */
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
@keyframes bspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* 对角贯穿斜线（加深加粗，可多层平行） */
.dline{position:absolute;left:-16vw;width:132vw;height:var(--th,.5vh);transform:rotate(-18deg);
  background:var(--lc,rgba(20,18,16,.4));opacity:var(--lo,.4);pointer-events:none;z-index:0}
/* 断续斜条：-18° 对角线方向，自左下向右上方循环扫过（虚线段 = repeating 渐变断点）
   位移量 ±185vw / ±106.9vh 在 16:9 下严格贴合 -18° 轴线（tan18° = 10.8 换算） */
.dstrip{position:absolute;left:50%;width:260vw;margin-left:-130vw;height:var(--h,.5vh);
  background:repeating-linear-gradient(90deg,var(--sc,rgba(217,58,18,.4)) 0 var(--s1,2vw),transparent var(--s1,2vw) var(--s2,3.6vw));
  pointer-events:none;z-index:0;will-change:transform;
  animation:dstrip var(--dd,14s) linear var(--dl,0s) infinite}
@keyframes dstrip{
  from{transform:translate3d(-185vw,106.9vh,0) rotate(-18deg)}
  to{transform:translate3d(185vw,-106.9vh,0) rotate(-18deg)}
}
/* 不规则大斜块（低透明度衬底） */
.shard{position:absolute;background:var(--sc,rgba(20,18,16,.05));transform:rotate(-18deg);pointer-events:none;z-index:0}
/* 轨道圆：旋转的圆环上带游动圆点（动态圆组件） */
.orbit{position:absolute;border:2px solid var(--oc2,rgba(20,18,16,.22));border-radius:50%;pointer-events:none;z-index:0;
  animation:bspin var(--od,26s) linear infinite}
.orbit.rev{animation-direction:reverse}
.orbit i{position:absolute;left:50%;top:-1.25vh;width:1.7vh;height:1.7vh;margin-left:-.85vh;border-radius:50%;
  background:var(--oc,var(--red))}
.orbit i.o2{top:auto;bottom:-1vh;left:18%;width:1.05vh;height:1.05vh;margin-left:-.5vh;background:var(--p);
  border:2px solid var(--bg)}
/* 脉冲圆：扩散消散 */
.pulse{position:absolute;border:3px solid var(--pc,rgba(217,58,18,.5));border-radius:50%;pointer-events:none;z-index:0;
  animation:ppulse var(--pd,5s) ease-out var(--pl,0s) infinite}
@keyframes ppulse{0%{transform:scale(.5);opacity:0}18%{opacity:.75}100%{transform:scale(1.3);opacity:0}}
/* 旋转弧线（半透明单侧描边圆） */
.arc{position:absolute;border:var(--ab,.6vh) solid transparent;border-top-color:var(--ac,var(--p));
  border-left-color:var(--ac,var(--p));border-radius:50%;pointer-events:none;z-index:0;
  animation:bspin var(--ad,20s) linear infinite}
.arc.rev{animation-direction:reverse}
.dots{position:absolute;width:15vw;height:13vh;background-image:radial-gradient(circle,var(--p) 1.8px,transparent 1.9px);
  background-size:1.15vh 1.15vh;-webkit-mask-image:linear-gradient(215deg,#000 25%,transparent 78%);
  mask-image:linear-gradient(215deg,#000 25%,transparent 78%);opacity:.55;pointer-events:none;z-index:0}
.ring{position:absolute;width:15vh;height:15vh;border:.6vh solid var(--red);border-radius:50%;z-index:0}
.bring{position:absolute;border:.6vh dashed var(--rc2,rgba(20,18,16,.22));border-radius:50%;pointer-events:none;z-index:0;
  animation:bspin var(--bd,120s) linear infinite}
.bring.rev{animation-direction:reverse}
.sline{position:absolute;height:.5vh;width:26vw;transform:rotate(-18deg);opacity:.75;pointer-events:none;z-index:0;
  background:linear-gradient(90deg,transparent,var(--lc,rgba(217,58,18,.5)) 18%,var(--lc,rgba(217,58,18,.5)) 82%,transparent);
  animation:sdrift 12s ease-in-out infinite alternate}
@keyframes sdrift{from{transform:rotate(-18deg) translateX(-2.5vw)}to{transform:rotate(-18deg) translateX(2.5vw)}}
.vstrip{position:absolute;top:13vh;right:1.2vw;writing-mode:vertical-rl;font-family:var(--mono);font-size:1.25vh;
  font-weight:700;letter-spacing:6px;color:rgba(20,18,16,.34);pointer-events:none;z-index:0}
.vstrip.l{right:auto;left:1.2vw}
.bignum{position:absolute;right:2.4vw;top:15vh;font-family:var(--mono);font-weight:700;font-size:33vh;line-height:1;
  color:transparent;-webkit-text-stroke:2.5px var(--p);opacity:.13;transform:rotate(9deg);pointer-events:none;z-index:0}
.tris{position:absolute;display:flex;gap:.55vh;z-index:0;pointer-events:none}
.tris i{width:0;height:0;border-left:1vh solid transparent;border-right:1vh solid transparent;border-top:1.5vh solid var(--tc,var(--red))}
.finband{position:absolute;bottom:-7vh;right:-6vw;width:74vw;height:17vh;transform:rotate(-8deg);
  background:linear-gradient(105deg,transparent,rgba(20,18,16,.05) 30%,rgba(217,58,18,.09) 70%,transparent)}

/* ===== 三层斜切擦除转场（红边锋 → 墨色主体+半调 → 项目色尾随） ===== */
#wipe{position:fixed;inset:0;z-index:40;pointer-events:none;will-change:transform}
#wipe.rev{transform:scaleX(-1)}
.w{position:absolute;top:-14vh;bottom:-14vh;left:0;transform:translateX(-170vw) skewX(-14deg);will-change:transform}
.w1{left:150vw;width:3vw;background:var(--red)}
.w2{width:150vw;background:var(--ink);
  background-image:radial-gradient(rgba(244,239,227,.15) 1.2px,transparent 1.3px);background-size:14px 14px}
.w3{left:-5vw;width:4.2vw;background:var(--wc,#d93a12)}
@keyframes wIn{from{transform:translateX(-170vw) skewX(-14deg)}to{transform:translateX(0) skewX(-14deg)}}
@keyframes wOut{from{transform:translateX(0) skewX(-14deg)}to{transform:translateX(130vw) skewX(-14deg)}}

.chip{display:inline-block;border:2.5px solid var(--ink);padding:.45vh .8vw;font-family:var(--mono);font-size:1.4vh;
  letter-spacing:1px;background:var(--card);box-shadow:.35vw .4vh 0 var(--p);font-weight:600}
.qb{height:1.1vh;border:2px solid var(--ink);position:relative;background:var(--bg);margin:1vh 0 .6vh}
.qb i{position:absolute;left:0;top:0;bottom:0;background:var(--p)}
.qb-l{display:flex;justify-content:space-between;font-size:1.3vh;color:var(--mut);font-family:var(--mono)}
.qb-l b{color:var(--ink);font-size:1.5vh}
.qc{border:2.5px solid var(--ink);background:var(--card);box-shadow:.6vw .65vh 0 var(--p);padding:1.3vh 1.1vw}
.qc.mid{border-color:var(--red);box-shadow:.6vw .65vh 0 var(--red)}
.qc-h{display:flex;align-items:baseline;gap:.6vw;border-bottom:2.5px solid var(--ink);padding-bottom:.7vh}
.qc-h b{font-size:2.1vh;letter-spacing:.5px}
.qc-h span{margin-left:auto;font-family:var(--mono);font-size:1.2vh;color:var(--mut)}
.qtag-sq{width:1.3vh;height:1.3vh;background:var(--red);flex:none;align-self:center;transform:rotate(45deg)}
.qr{display:grid;grid-template-columns:auto 1fr;gap:.5vh .8vw;font-size:1.65vh;margin-top:.7vh}
.qr i{color:var(--mut);font-style:normal;font-size:1.3vh}
.qr b{text-align:right;font-weight:700}
.qr b.rd{color:var(--red)}

/* ===== 封面 ===== */
.cv{flex-direction:row;gap:2.2vw}
.cv-l{flex:0 0 55%;position:relative;z-index:1;display:flex;flex-direction:column}
.cv-r{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.4vh;z-index:1;min-width:0}
.cv h1{font-size:11vh;line-height:1.02;font-weight:900;letter-spacing:-.3vw;margin:2.4vh 0 1.2vh;
  transform:rotate(-1.6deg);text-shadow:.42vw .48vh 0 var(--red)}
.cv h1 .tred{display:inline-block;width:1.7vw;height:3.4vh;background:var(--red);margin-left:1vw;vertical-align:baseline}
.cv-sub{font-size:4.6vh;font-weight:900;letter-spacing:.1vw;transform:rotate(-.8deg)}
.cv-en{font-family:var(--mono);font-size:1.4vh;letter-spacing:2.5px;color:var(--mut);margin-top:1.2vh}
.cv-env{border-top:3.5px solid var(--ink);margin-top:2.4vh;padding-top:1.4vh;display:grid;grid-template-columns:1fr 1fr;gap:1.1vh 1.6vw}
.cv-env div{display:flex;gap:.6vw;font-size:1.6vh;align-items:baseline}
.cv-env i{color:var(--mut);font-style:normal;font-size:1.25vh;letter-spacing:1px;flex:none}
.cv-env b{font-weight:700}
.cv-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2vw;padding-top:2vh}
.mx-t{font-size:1.5vh;margin-bottom:.9vh}
.mx-t b{font-weight:800}
.mx-t span{display:block;font-family:var(--mono);font-size:1.2vh;color:var(--mut);letter-spacing:1px;margin-top:.4vh}
.mx{display:grid;grid-template-columns:repeat(3,3.6vh);gap:.9vh}
.mx i{width:3.6vh;height:3.6vh;border:2.5px solid var(--ink)}
.mx-legend{margin-top:1vh;font-size:1.25vh;display:flex;gap:1.1vw}
.mx-legend em{font-style:normal;color:var(--mut);letter-spacing:.5px;font-weight:600}
.mx-legend em::before{content:"";display:inline-block;width:1vh;height:1vh;background:var(--c);border:2px solid var(--ink);margin-right:.4vw;vertical-align:-.15vh}
.cv-r2{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.cv-go{font-size:2vh;font-weight:800;letter-spacing:1px;text-align:right}
.cv-go b{color:var(--red);font-size:2.6vh}
.cv-go .goarr{display:inline-block;color:var(--red);font-size:2.8vh;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(.5vw)}}
.cv-bgm{margin-top:1.6vh;display:inline-flex;align-items:center;gap:.6vw;border:2.5px solid var(--ink);background:var(--card);
  box-shadow:.4vw .45vh 0 var(--red);padding:.7vh 1vw;font-family:var(--mono);font-size:1.4vh;letter-spacing:1px;cursor:pointer}
.cv-bgm i{width:1.3vh;height:1.3vh;background:var(--red);flex:none}
.cv-bgm b{font-weight:700}
.cv-bgm .st{color:var(--mut);font-size:1.2vh}
.cv-art{position:absolute;top:5vh;right:0;width:46vw;height:34vh;z-index:0;pointer-events:none}
.blk{position:absolute;width:31vw;height:10vh;background:var(--ink);transform:rotate(-4deg);right:1.5vw;top:2vh}
.blk2{position:absolute;width:5vh;height:5vh;background:var(--ink);right:4.5vw;top:16.5vh;transform:rotate(8deg)}
.ring.rt{right:9.5vw;top:0}
.diag{position:absolute;top:63%;left:-6vw;width:112vw;height:3.5px;background:var(--red);transform:rotate(-13deg);z-index:0;pointer-events:none}
.cv-dots{left:33vw;bottom:8vh}
.cv-tris{left:33vw;bottom:20vh}

/* ===== 项目设定页 ===== */
.hd-top{display:flex;align-items:center;gap:1.2vw;z-index:1}
.chips{display:flex;gap:.7vw}
.hd-ghost{right:2vw;top:.5vh}
.hd-main{flex:1;display:flex;gap:1.8vw;min-height:0;margin-top:1vh}
.hd-l{flex:0 0 51%;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.hd-title{display:flex;align-items:baseline;gap:1vw}
.hd-title b{font-size:7.4vh;line-height:1;font-weight:900;display:inline-block;transform:rotate(-1.5deg);
  text-shadow:.35vw .4vh 0 var(--p)}
.hd-title span{font-family:var(--mono);font-size:1.9vh;letter-spacing:4px;color:var(--mut)}
.hd-sub{font-size:1.8vh;color:var(--mut);margin:.6vh 0 .7vh;letter-spacing:1px;font-weight:600}
.mot-wrap{margin:.2vh 0 .9vh}
.mot{width:11vw;height:2.9vh;display:block}
.pb{flex:1;display:flex;flex-direction:column;border:3px solid var(--ink);background:var(--card);
  box-shadow:.9vw 1vh 0 var(--p);min-height:0;transform:rotate(-.6deg)}
.pb-t{display:flex;align-items:center;background:var(--red);color:var(--bg);font-family:var(--mono);
  font-size:1.7vh;letter-spacing:4px;padding:.9vh 1.2vw;font-weight:800}
.pb-t::before{content:"";width:1.5vh;height:1.5vh;background:var(--ink);margin-right:1vw;flex:none}
.pb-hint{margin-left:auto;font-size:1.15vh;letter-spacing:2px;opacity:.9;display:flex;align-items:center;gap:.5vw;font-weight:700}
.pb-hint::after{content:"▼";animation:nudgev 1.6s ease-in-out infinite}
@keyframes nudgev{0%,100%{transform:translateY(0)}50%{transform:translateY(.35vh)}}
.pb-b{flex:1;overflow-y:auto;overflow-x:hidden;background:#16130f;color:#efe8d8;
  font-family:var(--mono);font-size:1.62vh;line-height:1.62;padding:1.5vh 1.1vw 1.5vh 0;border-top:3px solid var(--ink)}
.pline{display:flex;gap:.7vw}
.pline .ln{flex:none;width:2.6ch;text-align:right;color:rgba(217,58,18,.9);font-size:1.22vh;padding-top:.2vh;
  user-select:none;border-right:2px solid rgba(239,232,216,.2);margin-right:.4vw;letter-spacing:0}
.pline .pt{white-space:pre-wrap;min-width:0}
.pb-b::-webkit-scrollbar{width:1.1vh}
.pb-b::-webkit-scrollbar-track{background:#16130f}
.pb-b::-webkit-scrollbar-thumb{background:var(--red);border:3px solid #16130f}
.pb-b::-webkit-scrollbar-thumb:hover{background:#ff5a2a}
.hd-r{flex:1;display:flex;flex-direction:column;gap:1.5vh;min-height:0;position:relative;z-index:1}
.hd-r .qc{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hd-rec{border:2.5px solid var(--ink);background:var(--card);box-shadow:.6vw .65vh 0 var(--p);padding:1.1vh 1.1vw;margin-top:auto}
.hd-rec .hr-t{font-family:var(--mono);font-size:1.3vh;letter-spacing:2px;color:var(--mut);border-bottom:2.5px solid var(--ink);padding-bottom:.6vh;margin-bottom:.6vh;font-weight:700}
.hr{display:flex;align-items:baseline;gap:.7vw;font-size:1.55vh;padding:.32vh 0}
.hr i{width:1.1vh;height:1.1vh;background:var(--red);flex:none;align-self:center}
.hr b{font-family:var(--mono);font-weight:700;font-size:1.55vh}
.hr span{margin-left:auto;font-family:var(--mono);font-size:1.25vh;color:var(--mut)}
.hd-note{display:flex;align-items:center;gap:.8vw;font-size:1.7vh;letter-spacing:.5px;z-index:1;font-weight:600;margin-top:.8vh;flex:none}
.hd-note i{width:.55vw;height:2.3vh;background:var(--red);flex:none}
.hd-note b{color:var(--red)}

/* ===== 录像页 ===== */
.vt-top{display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.vt-tr{display:flex;align-items:center;gap:1.1vw}
.vt-tr .mot{width:5.5vw;height:1.8vh}
.qtag{background:var(--red);color:#fff;padding:1.1vh 1.3vw;box-shadow:.6vw .65vh 0 var(--p);text-align:right;transform:skewX(-6deg)}
.qtag b{font-size:2.6vh;letter-spacing:1px;display:block;font-weight:800}
.qtag span{font-family:var(--mono);font-size:1.3vh;opacity:.95}
.tc{font-family:var(--mono);font-size:1.5vh;color:var(--ink);letter-spacing:1px;margin-top:1.6vh;z-index:1;font-weight:600}
.tc .dim{color:var(--mut)}
.tc b{color:var(--ink);font-weight:700}
.tc .rd{color:var(--red)}
.recdot{display:inline-block;width:1.25vh;height:1.25vh;background:var(--red);margin-right:.55vw;vertical-align:.15vh;
  animation:blink 1.3s steps(2,start) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
.film{position:relative;width:75vw;aspect-ratio:16/9;margin:1.5vh auto 0;background:#0d0b09;border:3.5px solid var(--ink);
  box-shadow:1.1vw 1.2vh 0 var(--p);z-index:1;overflow:hidden}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:1.2vh;z-index:3;
  background:repeating-linear-gradient(90deg,transparent 0 1.1vw,var(--bg) 1.1vw 1.9vw)}
.film::before{top:.6vh}.film::after{bottom:.6vh}
.film video{position:absolute;left:0;right:0;top:2.4vh;bottom:2.4vh;width:100%;height:calc(100% - 4.8vh);
  object-fit:cover;background:#000}
/* 假全屏（P 键/点击）：铺满视口，不触发浏览器全屏 → 无 Esc 提示条 */
.film.fsplay{position:fixed;left:0;top:0;width:100vw;height:100vh;margin:0;z-index:120;
  box-shadow:none;border-width:0;transform:none}
.film.fsplay video{top:0;bottom:0;height:100%;object-fit:contain}
.film.fsplay::before,.film.fsplay::after{display:none}
.film.fsplay .vbtn{display:none}
.film.fsplay .vph{z-index:1}
.vbtn{position:absolute;right:1.7vw;bottom:2.1vh;z-index:4;display:flex;align-items:center;gap:.55vw;
  background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:1.55vh;letter-spacing:1px;font-weight:700;
  padding:.9vh 1.1vw;border:2.5px solid var(--bg);box-shadow:.4vw .45vh 0 var(--red);cursor:pointer}
.vbtn::before{content:"";width:1.4vh;height:1.4vh;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}
.film.novideo .vbtn{display:none}
.vph{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.3vh;
  background:repeating-linear-gradient(45deg,#14110d 0 14px,#1d1914 14px 28px)}
.film.novideo .vph{display:flex}
.film.novideo video{display:none}
.vph-t{font-size:5.5vh;font-weight:900;letter-spacing:10px;color:transparent;-webkit-text-stroke:2.5px var(--red)}
.vph-p{font-family:var(--mono);font-size:1.55vh;border:2.5px dashed rgba(244,239,227,.65);padding:.8vh 1.1vw;color:#f4efe3}
.vph-h{font-size:1.35vh;color:rgba(244,239,227,.7);letter-spacing:1px}
/* 全屏转场：进入 fsIn（淡入+轻微放大）/ 结束或手动退出 fsOut（淡出回幻灯片）
   全屏期间 film 被移到 body，原位留 .film-ghost 占位，录像页版式不塌陷 */
.film.fsplay{animation:fsIn .5s cubic-bezier(.8,0,.2,1) both}
@keyframes fsIn{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:scale(1)}}
.film.fs-exit{animation:fsOut .52s cubic-bezier(.45,0,.9,.55) both;pointer-events:none}
@keyframes fsOut{from{opacity:1}to{opacity:0}}
/* ghost 必须与 .film 的盒规则完全一致（含 overflow:hidden——它对 flex 子项的
   aspect-ratio 高度解析有实测 3.28px 影响），否则全屏时 .stats 会位移 */
.film-ghost{position:relative;width:75vw;aspect-ratio:16/9;margin:1.5vh auto 0;background:#0d0b09;

.stats{display:flex;align-items:stretch;margin-top:auto;padding-top:1.4vh;border-top:3px solid var(--ink);z-index:1}
.st{display:flex;align-items:baseline;gap:.6vw;padding:0 1.25vw}
.st:first-child{padding-left:0}
.st + .st{border-left:2.5px solid var(--faint)}
.st i{color:var(--mut);font-style:normal;font-size:1.4vh;letter-spacing:1px;font-weight:600}
.st b{font-size:2.2vh;font-weight:800}
.st.rec b{color:var(--red);font-size:2.7vh}

.sm-rowlab .rl{display:flex;align-items:center;gap:.55vw}
.sm-rowlab .sq{width:1.9vh;height:1.9vh;border:2.5px solid var(--ink);flex:none;transform:rotate(45deg)}

.sm-rowlab span{font-family:var(--mono);font-size:1.25vh;color:var(--mut);margin-left:.55vw}

/* ===== 其他作品 · 滚筒 ===== */
.ox-top{display:flex;align-items:center;gap:1.4vw;z-index:1}

/* ===== 结束页 ===== */

.fin-line{width:22vw;height:.6vh;background:var(--ink)}

.cr .en{font-family:var(--mono);font-size:1.5vh;color:var(--mut);margin-left:auto;font-weight:700;letter-spacing:2px}

.cr.cast i{color:var(--bg);font-size:3vh}
.cr.cast b{color:var(--bg);font-size:4.3vh;font-weight:900}

/* ===== HUD ===== */
#hud{position:fixed;left:0;right:0;bottom:0;height:4.2vh;display:flex;align-items:center;gap:1.5vw;
  padding:0 2.4vw;border-top:2.5px solid var(--ink);background:var(--bg);z-index:50;font-family:var(--mono)}
#mbtn{width:2.4vw;height:2.4vw;border:2.5px solid var(--ink);background:var(--card);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.6vh;color:var(--ink);font-weight:700;flex:none}

#hudc{flex:1;text-align:center;font-size:1.6vh;color:var(--ink);letter-spacing:2px;font-weight:700}
#hudr{display:flex;align-items:center;gap:1.3vw}

#track i{width:1.4vw;height:1.4vw;border:2.5px solid #999;color:currentColor}
#track i.hit{background:currentColor}
#keys{font-size:1.25vh;color:var(--mut);letter-spacing:.5px;font-weight:600}

/* ===== 落幕：拉灯绳（P5R 斗篷式） ===== */
#curtain{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}
#curtain.on{display:block}
#curtain.clickable{pointer-events:auto;cursor:pointer}
#curtainSvg{position:absolute;inset:0;width:100%;height:100%}
#curtainHint{position:absolute;left:50%;top:18.5vh;transform:translateX(1.6vw);font-family:var(--mono);
  font-size:1.5vh;font-weight:700;letter-spacing:2px;color:var(--red);white-space:nowrap;
  animation:hintblink 1.5s ease-in-out infinite}
@keyframes hintblink{0%,100%{opacity:.2}50%{opacity:.95}}
#stage.jolt{animation:jolt .35s linear}
@keyframes jolt{0%{transform:translate(0,0)}18%{transform:translate(.5vw,-.55vh)}38%{transform:translate(-.5vw,.45vh)}
  58%{transform:translate(.4vw,.3vh)}78%{transform:translate(-.25vw,-.2vh)}100%{transform:translate(0,0)}}
</style>
</head>

<script type="text/plain" id="prompt-1">请实现一个单文件 HTML 网页，使用纯 Canvas 2D（不依赖任何库），模拟风暴黄昏海面。

视觉要求：
1. 5层不同深度的海浪，前景波浪更狂暴、颜色更浅、更透明；后景波浪更深沉、颜色更暗、更有深渊感。
2. 波峰有白色泡沫，海面波浪碎裂成粒子，粒子有飞溅、重力、衰减。
3. 黄昏黄色太阳透过浓重云层，在水面照出模糊的光晕，太阳在地平线附近模糊显现。
4. 天空从蓝色渐变到黑色，太阳附近的乌云被晕染出渐变黄色。
5. 无缝循环动画，电影感，可加入暗角、颗粒、动态模糊等后期效果。

技术约束：
- 纯 Canvas 2D，禁止使用任何外部库或资源。
- 动画必须自动运行，无需用户交互。

输出要求：
- 保存为html文件给出说明
- 请调用你所有的能力，生成你当前能实现的最高水准作品。</script>
<script type="text/plain" id="prompt-2">生成一个单文件HTML网页，要求呈现出极其震撼的3D海上龙卷风/风暴视觉奇观。技术栈不限，可以使用任何你认为能发挥到极致的Web技术（WebGL、Three.js、原生GLSL等均可），但所有代码和资源必须完全包含在该HTML文件内（可引用CDN的Three.js等库，但所有自定义脚本、着色器、材质、粒子系统必须内联）。

视觉与美术要求：
- 龙卷风本体：需体现从云层延伸至海面的漏斗状涡旋，内部有旋转的粒子、水汽、碎片，可见空气涡旋的层次与体积感，光影和色彩必须真实而富有表现力。
- 风暴海面：巨大的海浪汹涌澎湃，波峰有白色泡沫，海面有飞溅的浪花和反射，需呈现风暴中的动荡与力量。
- 云层与天空：厚重的积雨云暗沉旋转，云层内部有周期性闪电闪烁，照亮云层和海面，营造出风暴的压抑与戏剧性。
- 粒子效果：包含雨幕、水雾、被卷起的海水粒子、碎片等动态粒子，增强风暴的混乱感。
- 前端界面：一个简洁美观、与风暴主题高度统一的UI，可包含风速、气压、粒子数等数据展示，整体设计符合科幻暗黑美学。
- 所有美术效果请毫无保留地拉满，力求达到电影级/艺术馆级别的观赏性。

交互要求：
- 页面需支持基本的视角操控（鼠标拖拽旋转、滚轮缩放），可加入自动缓慢旋转。
- 包含适当的动画或动态效果（龙卷风旋转、海浪动画、粒子运动、闪电周期性出现）。

技术约束：
- 单文件 HTML，所有代码内联，可引用 CDN 的 Three.js 等库，但自定义着色器必须内联。
- 允许近似模拟（如龙卷风用粒子螺旋，海面用噪声波形），鼓励视觉效果优先。

输出要求：
- 请调用你所有的能力，生成你当前能实现的最高水准作品。</script>
<script type="text/plain" id="prompt-3">你是一名资深 Three.js/WebGL/GLSL 图形工程师，请从零生成一个完整的实时雷暴海面场景（可多文件，也可单文件，但不限制代码行数）。使用原生 HTML/CSS/JavaScript（ES Modules），可通过 CDN 引入 Three.js，不依赖任何构建工具或框架。所有自定义着色器、程序化生成逻辑必须自己实现，禁止使用外部纹理、模型、字体等资源（星空、云层、水面、雨滴、闪电等必须程序化生成）。

视觉与美术要求：
- 场景主体：无限或大面积海面，上方是厚重旋转的雷暴云层。
- 海面：动态波浪，有明显起伏；受风力影响，浪花与泡沫；雨滴撞击水面产生涟漪和轻微飞溅。
- 雨：大量雨滴粒子，带重力，受风影响产生倾斜；粒子数量根据性能动态调整。
- 风：可通过雨滴倾斜、海浪加剧、云层旋转来体现，不需要单独粒子。
- 闪电：周期性出现，至少两种表现：云层内部闪烁（体积光感）和劈向海面的枝状闪电（可用线段或粒子模拟）。闪电瞬间照亮整个场景，包括云层内部、海面反射、雨滴高光。
- 体积光：当闪电发生时，云层内部要有光线穿透的发光效果（可用后处理 bloom + 云层内部自发光近似，或简单 ray marching 体积采样），营造震撼的光影。
- 天空与氛围：整体黑暗压抑，云层暗沉厚重，闪电时云层边缘被照亮，海面反射暖白/蓝白强光。可加入暗角、胶片颗粒、色差等后期效果增强电影感。
- 前端界面：显示虚拟风速、雨量、雷电频率、气压等数据；可有一个按钮手动触发闪电。

交互要求：
- 鼠标拖拽旋转视角，滚轮缩放（可固定在海面高度，允许俯视或平视）。
- 自动缓慢镜头环绕可选，默认开启或快捷键切换。
- 闪电自动周期性发生，也允许用户按键触发（如按 L 键）。

技术约束：

    var k = tip + 1.2;
    cKnot.setAttribute("d", "M" + tipX.toFixed(2) + " " + (tip - 0.3).toFixed(2) + "L" + (tipX + 1).toFixed(2) + " " + k.toFixed(2) +
      "L" + tipX.toFixed(2) + " " + (tip + 2.7).toFixed(2) + "L" + (tipX - 1).toFixed(2) + " " + k.toFixed(2) + "Z");
    cKnot.setAttribute("opacity", op);
  }
  function curtainReset() {
    curt.state = "idle"; curt.t = 0; curt.jolted = false; curt.dirty = true;
    cHint.style.display = "";
    for (var i = 0; i < cStops.length; i++) cStops[i].setAttribute("stop-color", cCss(C_BASE[i]));
    cEdge.setAttribute("opacity", "0.9");
    cEdgeGlow.setAttribute("opacity", "0.55");
    cEl.classList.toggle("clickable", cEl.classList.contains("on"));
  }
  function curtainPull() {
    if (curt.state !== "idle") return;
    curt.state = "pull"; curt.t = 0; curt.jolted = false; curt.dirty = true;
    cHint.style.display = "none";
    cEl.classList.remove("clickable");
  }
  (function cTick(ts) {
    if (!curt.last) curt.last = ts;
    var dt = Math.min(0.05, (ts - curt.last) / 1000);
    curt.last = ts;
    if (curt.state === "done" && !curt.dirty) { requestAnimationFrame(cTick); return; }
    curt.t += dt;
    var t = curt.t;
    if (curt.state === "idle") {
      var sw = Math.sin(t * 1.3);
      cPath.setAttribute("d", ""); cClipPath.setAttribute("d", "");
      cEdge.setAttribute("d", ""); cEdgeGlow.setAttribute("d", "");
      cDrawRope(80 + sw * 0.9, 16 + Math.sin(t * 1.3 + 0.8) * 0.4, sw * 1.1, 1);
      requestAnimationFrame(cTick); return;
    }
    var u, sag, amp, ph, tipX = 80, bow = 0, dark = 0;
    if (curt.state === "pull") {
      var p = Math.min(1, t / 1.5);
      var e = 1 - Math.pow(1 - p, 2.4);
      u = 16 + (93 - 16) * e;
      sag = 9 * (1 - e) + 1.1;
      amp = 1.7 * (1 - e) + 0.3;
      ph = t * 11;
      tipX = 80 + Math.sin(t * 22) * 0.5 * (1 - e);
      bow = Math.sin(t * 18) * 0.6 * (1 - e);
      if (p >= 1) {
        curt.state = "settle"; curt.t = 0;
        if (!curt.jolted) { curt.jolted = true; cStage.classList.remove("jolt"); void cStage.offsetWidth; cStage.classList.add("jolt"); }
      }
    } else if (curt.state === "settle") {
      u = 93; sag = 1.1; amp = 1.6 * Math.exp(-4 * t) + 0.25; ph = t * 11;
      if (t > 0.35) { curt.state = "dark"; curt.t = 0; }
    } else if (curt.state === "dark") {
      u = 93; sag = 1.1; amp = 0.25; ph = 0;
      dark = Math.min(1, t / 0.8);
      if (dark >= 1) { curt.state = "done"; curt.dirty = false; }
    }
    if (u > 0.5) {
      var df = cBuildFill(u, sag, amp, ph);
      cPath.setAttribute("d", df);
      cClipPath.setAttribute("d", df);
      var de = cBuildEdge(u, sag, amp, ph);
      cEdge.setAttribute("d", de);
      cEdgeGlow.setAttribute("d", de);
      cEdge.setAttribute("opacity", (0.9 * (1 - dark)).toFixed(3));
      cEdgeGlow.setAttribute("opacity", (0.55 * (1 - dark)).toFixed(3));
    }
    if (dark > 0) {
      for (var i = 0; i < cStops.length; i++) cStops[i].setAttribute("stop-color", cCss(cLerp(C_BASE[i], [0,0,0], dark)));
    }
    if (curt.state === "done") {
      cDrawRope(80, 16, 0, 0);
    } else {
      cDrawRope(tipX, u, bow, 1);
    }
    requestAnimationFrame(cTick);
  })(0);
  cEl.addEventListener("click", function () {
    if (curt.state === "idle") curtainPull();
    else if (curt.state === "done") curtainReset();
  });

  // ===== 音乐 =====
  var bgm = document.getElementById("bgm");
  var mbtn = document.getElementById("mbtn");
  var bgmst = document.getElementById("bgmst");
  var mstate = "auto";
  function paintMusic() {
    mbtn.classList.toggle("on", mstate === "on");
    if (bgmst) bgmst.textContent = mstate === "on" ? "播放中" : (mstate === "off" ? "已关 · M 开启" : "自动 · 任意键开始");
  }
  function setMusic(on) {
    mstate = on ? "on" : "off";
    if (on) bgm.play().catch(function () { mstate = "off"; });
    else bgm.pause();
    paintMusic();
  }
  bgm.addEventListener("play", function () { mstate = "on"; paintMusic(); });
  bgm.addEventListener("pause", function () { if (mstate !== "auto") { mstate = "off"; paintMusic(); } });
  mbtn.addEventListener("click", function (ev) { ev.stopPropagation(); setMusic(mstate !== "on"); });
  var chip = document.getElementById("bgmchip");
  if (chip) chip.addEventListener("click", function (ev) { ev.stopPropagation(); setMusic(mstate !== "on"); });
  paintMusic();
  function firstTouch() { if (mstate === "auto") setMusic(true); }
  document.addEventListener("keydown", firstTouch, true);
  document.addEventListener("pointerdown", firstTouch, true);

  stage.addEventListener("click", function (ev) {
    if (ev.target.closest(".film") || ev.target.closest("#mbtn") || ev.target.closest("#bgmchip")) return;
    go(idx + 1);
  });

  /* F：假全屏 = 纯净模式（隐藏底栏 + 隐藏鼠标，等同 ?clean=1 开关）。
     不走浏览器 Fullscreen API → 不会出现"按 Esc 退出全屏"提示条 */
  function toggleFS() {
    var on = !document.documentElement.classList.contains("clean");
    document.documentElement.classList.toggle("clean", on);
    hud.style.display = on ? "none" : "";
  }
  /* 录像页 2s 自动播放：切页到位后排程，2s 后起播；
     提前离开该页（或手动进全屏）即取消，不会在隐藏页起播 */
  function clearAutoPlay(s) { if (s && s._apt) { clearTimeout(s._apt); s._apt = null; } }
  function scheduleAutoPlay(s) {
    clearAutoPlay(s);
    if (!s || !s.film || s.film.classList.contains("novideo")) return;
    s._apt = setTimeout(function () {
      s._apt = null;
      if (fsFilm) return;                        // 已在全屏：播放由全屏路径接管
      var v = s.film.querySelector("video");
      if (v && v.paused) v.play().catch(function () {});
    }, 2000);
  }

  /* 假全屏：视频铺满视口（不走浏览器 Fullscreen API → 无 Esc 提示条）
     现代 Chromium 中 position:fixed 会建立堆叠上下文，#stage（fixed）把整个
     幻灯片子树的 z-index 锁死在其层级内，压不过 #hud（z:50）——
     所以全屏时把 film 移到 body 下参与根级堆叠，退出时还原。
     进入走 fsIn 转场（淡入+轻微放大）；视频结束或手动退出走 fsOut（淡出回幻灯片）；
     全屏期间原位留 .film-ghost 占位，录像页版式不塌陷。 */
  var fsFilm = null, fsFilmParent = null, fsFilmNext = null, fsGhost = null, fsExiting = false, fsExitT = 0;
  function enterFilmFS(film, s) {
    clearAutoPlay(s);
    fsGhost = document.createElement("div");
    fsGhost.className = "film-ghost";
    fsFilmParent = film.parentElement;
    fsFilmNext = film.nextSibling;
    fsFilmParent.insertBefore(fsGhost, film);
    document.body.appendChild(film);
    void film.offsetWidth;                       // 先以全屏位就位，再跑进入转场
    film.classList.add("fsplay");
    fsFilm = film;
    var v = film.querySelector("video");
    if (v) {
      if (v.ended || (isFinite(v.duration) && v.duration > 0 && v.currentTime >= v.duration - 0.06)) {
        try { v.currentTime = 0; } catch (e) {}  // 已播完则从头重播
      }
      v.play().catch(function () {});
    }
  }
  function exitFilmFS() {
    if (fsExitT) { clearTimeout(fsExitT); fsExitT = 0; }
    fsExiting = false;
    if (!fsFilm) return;
    var film = fsFilm, v = film.querySelector("video");
    fsFilm = null;
    film.classList.remove("fsplay", "fs-exit");
    if (fsGhost) { fsGhost.remove(); fsGhost = null; }
    if (fsFilmParent) fsFilmParent.insertBefore(film, fsFilmNext);
    fsFilmParent = null; fsFilmNext = null;
    if (v) v.pause();
  }
  /* 淡出退出（fsOut 0.52s 交叉回幻灯片）：视频结束 / 点击 / Esc 共用 */
  function exitFilmFaded() {
    if (!fsFilm || fsExiting) return;
    fsExiting = true;
    fsFilm.classList.add("fs-exit");
    fsExitT = setTimeout(function () {
      fsExitT = 0;
      var film = fsFilm, v = film ? film.querySelector("video") : null;
      exitFilmFS();
      if (v && SLIDES[idx].film === film) v.play().catch(function () {});  // 仍在本页则续上循环播放
    }, 540);
  }
  function playFilm() {
    if (fsExiting) return;
    var s = SLIDES[idx];
    var film = s.film;
    if (!film || film.classList.contains("novideo")) return;
    if (fsFilm === film) { exitFilmFaded(); return; }
    if (fsFilm) exitFilmFS();
    enterFilmFS(film, s);
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown" || ev.key === "Enter") {
      ev.preventDefault();
      if (idx === SLIDES.length - 1) {
        if (curt.state === "idle") curtainPull();
        else if (curt.state === "done") curtainReset();
        return;
      }
      go(idx + 1);
    }
    else if (ev.key === "ArrowLeft" || ev.key === "PageUp") {
      ev.preventDefault();
      if (idx === SLIDES.length - 1 && curt.state === "done") { curtainReset(); return; }
      go(idx - 1);
    }
    else if (ev.key === "Home") { ev.preventDefault(); go(0); }
    else if (ev.key === "End") { ev.preventDefault(); go(SLIDES.length - 1); }
    else if (ev.key === "f" || ev.key === "F") { ev.preventDefault(); toggleFS(); }
    else if (ev.key === "p" || ev.key === "P") { ev.preventDefault(); playFilm(); }
    else if (ev.key === "Escape") {
      if (idx === SLIDES.length - 1 && curt.state === "done") { ev.preventDefault(); curtainReset(); }
      else if (fsFilm) { ev.preventDefault(); exitFilmFaded(); }
    }
    else if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); setMusic(mstate !== "on"); }
    else if (ev.key === "0") { ev.preventDefault(); go(14); }
    else if (ev.key >= "1" && ev.key <= "9") {
      var k = parseInt(ev.key, 10) - 1;
      go(2 + Math.floor(k / 3) * 4 + (k % 3));
    }
  });

  window.__dsh_go = go;
  window.__dsh_idx = function () { return idx; };
  SLIDES[0].el.classList.add("on");
  showFx(SLIDES[0]);
  paint();
})();
</script>
</body>
</html>
