<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen3.8-27B · 不同量化效果直观对比</title>
<style>
:root{
  --bg:#f4efe3; --ink:#141210; --red:#d93a12;
  --p1:#2b4a9e; --p2:#0e6e68; --p3:#b97a10;
  --mut:#4a4238; --card:#fbf7ec; --faint:rgba(20,18,16,.22);
  --sans:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:2.8vh 3.2vw 5.8vh}
.slide.on{display:flex}
.slide[data-p="1"]{--p:var(--p1)} .slide[data-p="2"]{--p:var(--p2)} .slide[data-p="3"]{--p:var(--p3)}
.slide[data-p="0"]{--p:var(--red)}
.fx{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.9,.24,1)}
.fx.on{opacity:1;transform:none}
.plate{display:inline-flex;align-items:center;gap:.7vw;background:var(--ink);color:var(--bg);
  font-family:var(--mono);font-size:1.7vh;letter-spacing:2px;padding:1vh 1.1vw;width:max-content;
  box-shadow:.55vw .6vh 0 var(--p)}
.plate i{width:1.2vh;height:1.2vh;background:var(--red);flex:none}
.plate.sm{font-size:1.4vh;padding:.7vh .9vw}
.ghost{position:absolute;font-family:var(--mono);font-weight:700;font-size:27vh;line-height:1;color:transparent;
  -webkit-text-stroke:2.5px var(--p);opacity:.5;user-select:none;z-index:0;pointer-events:none}
.xm{position:absolute;width:1.6vh;height:1.6vh;z-index:5;pointer-events:none}
.xm::before,.xm::after{content:"";position:absolute;background:rgba(20,18,16,.4)}
.xm::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
.xm::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
.xm.tl{top:1.6vh;left:1.6vw}.xm.tr{top:1.6vh;right:1.6vw}.xm.bl{bottom:5.2vh;left:1.6vw}.xm.br{bottom:5.2vh;right:1.6vw}
.dots{position:absolute;width:15vw;height:13vh;background-image:radial-gradient(circle,var(--p) 1.8px,transparent 1.9px);
  background-size:1.15vh 1.15vh;-webkit-mask-image:linear-gradient(215deg,#000 25%,transparent 78%);
  mask-image:linear-gradient(215deg,#000 25%,transparent 78%);opacity:.55;pointer-events:none;z-index:0}
.ring{position:absolute;width:15vh;height:15vh;border:.6vh solid var(--red);border-radius:50%;z-index:0}
.chip{display:inline-block;border:2.5px solid var(--ink);padding:.45vh .8vw;font-family:var(--mono);font-size:1.4vh;
  letter-spacing:1px;background:var(--card);box-shadow:.35vw .4vh 0 var(--p);font-weight:600}
.qb{height:1.1vh;border:2px solid var(--ink);position:relative;background:var(--bg);margin:1vh 0 .6vh}
.qb i{position:absolute;left:0;top:0;bottom:0;background:var(--p)}
.qb-l{display:flex;justify-content:space-between;font-size:1.3vh;color:var(--mut);font-family:var(--mono)}
.qb-l b{color:var(--ink);font-size:1.5vh}
.qc{border:2.5px solid var(--ink);background:var(--card);box-shadow:.6vw .65vh 0 var(--p);padding:1.3vh 1.1vw}
.qc.mid{border-color:var(--red);box-shadow:.6vw .65vh 0 var(--red)}
.qc-h{display:flex;align-items:baseline;gap:.6vw;border-bottom:2.5px solid var(--ink);padding-bottom:.7vh}
.qc-h b{font-size:2.1vh;letter-spacing:.5px}
.qc-h span{margin-left:auto;font-family:var(--mono);font-size:1.2vh;color:var(--mut)}
.qtag-sq{width:1.3vh;height:1.3vh;background:var(--red);flex:none;align-self:center}
.qr{display:grid;grid-template-columns:auto 1fr;gap:.5vh .8vw;font-size:1.65vh;margin-top:.7vh}
.qr i{color:var(--mut);font-style:normal;font-size:1.3vh}
.qr b{text-align:right;font-weight:700}
.qr b.rd{color:var(--red)}

/* ===== 擦除式转场（色块扫过，杜绝残影） ===== */
#wipe{position:fixed;inset:0;z-index:40;background:var(--ink);transform:translateX(-102%);will-change:transform;pointer-events:none}
#wipe::before,#wipe::after{content:"";position:absolute;top:0;bottom:0;width:1.6vw;background:var(--red)}
#wipe::before{left:-1.6vw}#wipe::after{right:-1.6vw}
@keyframes wipeIn{from{transform:translateX(-102%)}to{transform:translateX(0)}}
@keyframes wipeOut{from{transform:translateX(0)}to{transform:translateX(102%)}}
@keyframes wipeInR{from{transform:translateX(102%)}to{transform:translateX(0)}}
@keyframes wipeOutR{from{transform:translateX(0)}to{transform:translateX(-102%)}}

/* ===== 封面 ===== */
.cv{flex-direction:row;gap:2.2vw}
.cv-l{flex:0 0 55%;position:relative;z-index:1;display:flex;flex-direction:column}
.cv-r{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.4vh;z-index:1;min-width:0}
.cv h1{font-size:11vh;line-height:1.02;font-weight:900;letter-spacing:-.3vw;margin:2.4vh 0 1.2vh}
.cv h1 .tred{display:inline-block;width:1.7vw;height:3.4vh;background:var(--red);margin-left:1vw;vertical-align:baseline}
.cv-sub{font-size:4.6vh;font-weight:900;letter-spacing:.1vw}
.cv-en{font-family:var(--mono);font-size:1.4vh;letter-spacing:2.5px;color:var(--mut);margin-top:1.2vh}
.cv-env{border-top:3.5px solid var(--ink);margin-top:2.4vh;padding-top:1.4vh;display:grid;grid-template-columns:1fr 1fr;gap:1.1vh 1.6vw}
.cv-env div{display:flex;gap:.6vw;font-size:1.6vh;align-items:baseline}
.cv-env i{color:var(--mut);font-style:normal;font-size:1.25vh;letter-spacing:1px;flex:none}
.cv-env b{font-weight:700}
.cv-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2vw;padding-top:2vh}
.mx-t{font-size:1.5vh;margin-bottom:.9vh}
.mx-t b{font-weight:800}
.mx-t span{display:block;font-family:var(--mono);font-size:1.2vh;color:var(--mut);letter-spacing:1px;margin-top:.4vh}
.mx{display:grid;grid-template-columns:repeat(3,3.6vh);gap:.9vh}
.mx i{width:3.6vh;height:3.6vh;border:2.5px solid var(--ink)}
.mx-legend{margin-top:1vh;font-size:1.25vh;display:flex;gap:1.1vw}
.mx-legend em{font-style:normal;color:var(--mut);letter-spacing:.5px;font-weight:600}
.mx-legend em::before{content:"";display:inline-block;width:1vh;height:1vh;background:var(--c);border:2px solid var(--ink);margin-right:.4vw;vertical-align:-.15vh}
.cv-r2{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.cv-go{font-size:2vh;font-weight:800;letter-spacing:1px;text-align:right}
.cv-go b{color:var(--red);font-size:2.6vh}
.cv-go .goarr{display:inline-block;color:var(--red);font-size:2.8vh;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(.5vw)}}
.cv-bgm{margin-top:1.6vh;display:inline-flex;align-items:center;gap:.6vw;border:2.5px solid var(--ink);background:var(--card);
  box-shadow:.4vw .45vh 0 var(--red);padding:.7vh 1vw;font-family:var(--mono);font-size:1.4vh;letter-spacing:1px;cursor:pointer}
.cv-bgm i{width:1.3vh;height:1.3vh;background:var(--red);flex:none}
.cv-bgm b{font-weight:700}
.cv-bgm .st{color:var(--mut);font-size:1.2vh}
.cv-art{position:absolute;top:5vh;right:0;width:46vw;height:34vh;z-index:0;pointer-events:none}
.blk{position:absolute;width:31vw;height:10vh;background:var(--ink);transform:rotate(-4deg);right:1.5vw;top:2vh}
.blk2{position:absolute;width:5vh;height:5vh;background:var(--ink);right:4.5vw;top:16.5vh;transform:rotate(8deg)}
.ring.rt{right:9.5vw;top:0}
.diag{position:absolute;top:63%;left:-6vw;width:112vw;height:3.5px;background:var(--red);transform:rotate(-13deg);z-index:0;pointer-events:none}
.cv-dots{left:33vw;bottom:8vh}

/* ===== 项目设定页 ===== */
.hd-top{display:flex;align-items:center;gap:1.2vw;z-index:1}
.chips{display:flex;gap:.7vw}
.hd-ghost{right:2vw;top:.5vh}
.hd-main{flex:1;display:flex;gap:1.8vw;min-height:0;margin-top:1vh}
.hd-l{flex:0 0 51%;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.hd-title{display:flex;align-items:baseline;gap:1vw}
.hd-title b{font-size:7.4vh;line-height:1;font-weight:900}
.hd-title span{font-family:var(--mono);font-size:1.9vh;letter-spacing:4px;color:var(--mut)}
.hd-sub{font-size:1.8vh;color:var(--mut);margin:.6vh 0 .7vh;letter-spacing:1px;font-weight:600}
.mot-wrap{margin:.2vh 0 .9vh}
.mot{width:11vw;height:2.9vh;display:block}
.pb{flex:1;display:flex;flex-direction:column;border:3px solid var(--ink);background:var(--card);
  box-shadow:.75vw .85vh 0 var(--p);min-height:0}
.pb-t{background:var(--p);color:#fff;font-family:var(--mono);font-size:1.6vh;letter-spacing:3px;padding:.8vh 1.1vw;font-weight:600}
.pb-b{flex:1;overflow:hidden;padding:1.6vh 1.4vw;font-size:1.55vh;line-height:1.58;white-space:pre-wrap;font-weight:500}
.hd-r{flex:1;display:flex;flex-direction:column;gap:1.5vh;min-height:0;position:relative;z-index:1}
.hd-r .qc{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hd-rec{border:2.5px solid var(--ink);background:var(--card);box-shadow:.6vw .65vh 0 var(--p);padding:1.1vh 1.1vw;margin-top:auto}
.hd-rec .hr-t{font-family:var(--mono);font-size:1.3vh;letter-spacing:2px;color:var(--mut);border-bottom:2.5px solid var(--ink);padding-bottom:.6vh;margin-bottom:.6vh;font-weight:700}
.hr{display:flex;align-items:baseline;gap:.7vw;font-size:1.55vh;padding:.32vh 0}
.hr i{width:1.1vh;height:1.1vh;background:var(--red);flex:none;align-self:center}
.hr b{font-family:var(--mono);font-weight:700;font-size:1.55vh}
.hr span{margin-left:auto;font-family:var(--mono);font-size:1.25vh;color:var(--mut)}
.hd-note{display:flex;align-items:center;gap:.8vw;font-size:1.7vh;letter-spacing:.5px;z-index:1;font-weight:600;margin-top:.8vh;flex:none}
.hd-note i{width:.55vw;height:2.3vh;background:var(--red);flex:none}
.hd-note b{color:var(--red)}

/* ===== 录像页 ===== */
.vt-top{display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.vt-tr{display:flex;align-items:center;gap:1.1vw}
.vt-tr .mot{width:5.5vw;height:1.8vh}
.qtag{background:var(--red);color:#fff;padding:1.1vh 1.3vw;box-shadow:.6vw .65vh 0 var(--p);text-align:right}
.qtag b{font-size:2.6vh;letter-spacing:1px;display:block;font-weight:800}
.qtag span{font-family:var(--mono);font-size:1.3vh;opacity:.95}
.tc{font-family:var(--mono);font-size:1.5vh;color:var(--ink);letter-spacing:1px;margin-top:1.6vh;z-index:1;font-weight:600}
.tc .dim{color:var(--mut)}
.tc b{color:var(--ink);font-weight:700}
.tc .rd{color:var(--red)}
.film{position:relative;width:75vw;aspect-ratio:16/9;margin:1.5vh auto 0;background:#0d0b09;border:3.5px solid var(--ink);
  box-shadow:1.1vw 1.2vh 0 var(--p);z-index:1;overflow:hidden}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:1.2vh;z-index:3;
  background:repeating-linear-gradient(90deg,transparent 0 1.1vw,var(--bg) 1.1vw 1.9vw)}
.film::before{top:.6vh}.film::after{bottom:.6vh}
.film video{position:absolute;left:0;right:0;top:2.4vh;bottom:2.4vh;width:100%;height:calc(100% - 4.8vh);
  object-fit:cover;background:#000}
.vbtn{position:absolute;right:1.7vw;bottom:2.1vh;z-index:4;display:flex;align-items:center;gap:.55vw;
  background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:1.55vh;letter-spacing:1px;font-weight:700;
  padding:.9vh 1.1vw;border:2.5px solid var(--bg);box-shadow:.4vw .45vh 0 var(--red);cursor:pointer}
.vbtn::before{content:"";width:1.4vh;height:1.4vh;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}
.film.novideo .vbtn{display:none}
.vph{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.3vh;
  background:repeating-linear-gradient(45deg,#14110d 0 14px,#1d1914 14px 28px)}
.film.novideo .vph{display:flex}
.film.novideo video{display:none}
.vph-t{font-size:5.5vh;font-weight:900;letter-spacing:10px;color:transparent;-webkit-text-stroke:2.5px var(--red)}
.vph-p{font-family:var(--mono);font-size:1.55vh;border:2.5px dashed rgba(244,239,227,.65);padding:.8vh 1.1vw;color:#f4efe3}
.vph-h{font-size:1.35vh;color:rgba(244,239,227,.7);letter-spacing:1px}
.vnum{position:absolute;left:1.4vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:1.3vh;z-index:0;pointer-events:none}
.vnum b{font-family:var(--mono);font-weight:700;font-size:10.5vh;line-height:1}
.vnum .n1{color:var(--p)}
.vnum .n2{color:transparent;-webkit-text-stroke:2.5px var(--p)}
.vnum .bar{width:.45vw;height:4.5vh;background:var(--red)}
.vt-dots{right:2.5vw;bottom:7vh}
.stats{display:flex;align-items:stretch;margin-top:auto;padding-top:1.4vh;border-top:3px solid var(--ink);z-index:1}
.st{display:flex;align-items:baseline;gap:.6vw;padding:0 1.25vw}
.st:first-child{padding-left:0}
.st + .st{border-left:2.5px solid var(--faint)}
.st i{color:var(--mut);font-style:normal;font-size:1.4vh;letter-spacing:1px;font-weight:600}
.st b{font-size:2.2vh;font-weight:800}
.st.rec b{color:var(--red);font-size:2.7vh}

/* ===== 总结页 ===== */
.sm-top{display:flex;align-items:center;gap:1.4vw;z-index:1}
.sm-top h2{font-size:5.4vh;font-weight:900;letter-spacing:.1vw}
.sm-deco{position:absolute;top:1.5vh;right:2vw;width:16vw;height:15vh;z-index:0;pointer-events:none}
.sm-grid{flex:1;display:grid;grid-template-columns:11vw repeat(3,1fr);grid-template-rows:auto repeat(3,1fr) auto;
  gap:1.3vh .9vw;margin-top:1.5vh;min-height:0;z-index:1}
.sm-h{border-bottom:3.5px solid var(--ink);padding-bottom:.8vh;display:flex;flex-direction:column;gap:.4vh}
.sm-h b{font-size:2.5vh;font-weight:800}
.sm-h span{font-family:var(--mono);font-size:1.25vh;color:var(--mut)}
.sm-h .qb{margin:.6vh 0 0}
.sm-rowlab{display:flex;flex-direction:column;justify-content:center;gap:.6vh}
.sm-rowlab .rl{display:flex;align-items:center;gap:.55vw}
.sm-rowlab .sq{width:1.9vh;height:1.9vh;border:2.5px solid var(--ink);flex:none}
.sm-rowlab b{font-size:2vh;font-weight:800}
.sm-rowlab span{font-family:var(--mono);font-size:1.25vh;color:var(--mut);margin-left:.55vw}
.sm-c{display:flex;flex-direction:column;border:2.5px solid var(--ink);background:var(--card);
  box-shadow:.45vw .55vh 0 var(--rc);min-height:0;overflow:hidden}
.sm-c img{width:100%;flex:1;min-height:0;object-fit:cover;display:block;background:#111}
.sm-c .strip{display:flex;align-items:baseline;justify-content:space-between;gap:.6vw;border-top:2.5px solid var(--ink);
  padding:.55vh .8vw;background:var(--card)}
.sm-c .strip b{font-size:1.9vh;font-weight:800}
.sm-c .strip b.rd{color:var(--red)}
.sm-c .strip span{font-family:var(--mono);font-size:1.35vh;color:var(--mut);font-weight:600}
.sm-tc{display:flex;align-items:center;gap:1vw;border:2.5px solid var(--ink);background:var(--card);
  box-shadow:.4vw .5vh 0 var(--red);padding:.7vh 1vw;font-size:1.45vh}
.sm-tc i{font-style:normal;color:var(--mut);font-size:1.3vh;letter-spacing:1px;font-weight:600}
.sm-tc b{font-size:2.1vh;font-weight:800;margin-left:auto}
.sm-tc b.rd{color:var(--red)}
.sm-note{display:flex;gap:.8vw;align-items:flex-start;margin-top:1.3vh;border-left:.6vw solid var(--red);
  padding-left:1vw;font-size:1.55vh;line-height:1.5;z-index:1;font-weight:500}
.sm-note b{color:var(--red)}

/* ===== 其他作品 · 滚筒 ===== */
.ox-top{display:flex;align-items:center;gap:1.4vw;z-index:1}
.ox h2{font-size:5.4vh;font-weight:900}
.ox-sub{font-family:var(--mono);font-size:1.4vh;color:var(--mut);letter-spacing:2px;font-weight:600}
.ox-deco{margin-left:auto;display:flex;align-items:center;gap:1.2vw}
.dr{width:4vh;height:4vh;border:2.5px solid var(--ink);transform:rotate(45deg)}
.dr.f{background:var(--red)}
.drum-stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:135vw;min-height:0;margin-top:1vh;z-index:1}
.drum{position:relative;width:42vw;height:56vh;transform-style:preserve-3d;animation:oxspin 30s linear infinite}
.drum-stage:hover .drum{animation-play-state:paused}
@keyframes oxspin{from{transform:rotateY(0)}to{transform:rotateY(-360deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face-frame{position:relative;width:100%;height:100%;background:#0d0b09;border:3.5px solid var(--ink);
  box-shadow:1vw 1.1vh 0 var(--red);overflow:hidden}
.face-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.face-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;
  background:repeating-linear-gradient(45deg,#14110d 0 16px,#1d1914 16px 32px)}
.face-frame.ok .face-ph{display:none}
.face-ph .fn{font-family:var(--mono);font-weight:700;font-size:13vh;line-height:1;color:transparent;-webkit-text-stroke:2.5px var(--red)}
.face-ph .ft{font-size:3vh;font-weight:800;letter-spacing:4px;color:var(--bg)}
.face-ph .fp{font-family:var(--mono);font-size:1.55vh;border:2.5px dashed rgba(244,239,227,.65);padding:.8vh 1.1vw;color:#f4efe3}
.face-ph .fh{font-size:1.35vh;color:rgba(244,239,227,.7);letter-spacing:2px}
.face-plate{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--ink);color:var(--bg);
  font-family:var(--mono);font-size:1.5vh;letter-spacing:2px;padding:.7vh 1vw;display:flex;justify-content:space-between;font-weight:600}
.face-plate i{width:1.2vh;height:1.2vh;background:var(--red);display:inline-block;margin-right:.6vw;vertical-align:-.15vh}
.ox-hint{display:flex;gap:1.2vw;align-items:center;font-size:1.55vh;color:var(--mut);z-index:1;font-weight:600}
.ox-hint i{width:.5vw;height:2.2vh;background:var(--red);flex:none}
.ox-hint b{color:var(--ink)}

/* ===== 结束页 ===== */
.fin{flex-direction:row;align-items:stretch;gap:3vw}
.fin-l{flex:0 0 34%;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:2.6vh}
.fin-block{position:relative;width:30vh;height:30vh;background:var(--red);box-shadow:1.3vw 1.4vh 0 var(--ink);
  display:flex;align-items:center;justify-content:center}
.fin-block b{color:var(--bg);font-size:15vh;font-weight:900;line-height:1}
.fin-plate{align-self:flex-start}
.fin-line{width:22vw;height:.6vh;background:var(--ink)}
.fin-tag{font-family:var(--mono);font-size:1.5vh;letter-spacing:3px;color:var(--mut);font-weight:600}

<script type="text/plain" id="prompt-2">生成一个单文件HTML网页，要求呈现出极其震撼的3D海上龙卷风/风暴视觉奇观。技术栈不限，可以使用任何你认为能发挥到极致的Web技术（WebGL、Three.js、原生GLSL等均可），但所有代码和资源必须完全包含在该HTML文件内（可引用CDN的Three.js等库，但所有自定义脚本、着色器、材质、粒子系统必须内联）。

          '<div class="hd-title fx"><b>' + p.zh + '</b><span>' + p.en + '</span></div>' +
          '<div class="hd-sub fx">' + p.sub + '</div>' +
          '<div class="mot-wrap fx">' + mot(p) + '</div>' +
          '<div class="pb fx"><div class="pb-t">完整 PROMPT · 原样发送</div><div class="pb-b" data-prompt="' + p.n + '"></div></div>' +
        '</div>' +
        '<div class="hd-r"><div class="plate sm fx"><i></i>生成数据 DATA</div>' + cards +
          '<div class="hd-rec fx"><div class="hr-t">本段录像 · NEXT</div>' + QORDER.map(function (qk) { return '<div class="hr"><i></i><b>' + qfile(p, qk) + '</b><span>' + p.data[qk].dur + 's · 截取 ' + p.data[qk].cut + '</span></div>'; }).join(NL) + '</div></div>' +
      '</div>' +
      '<div class="hd-note fx"><i></i>下一节 · 三个量化各一段实机录像：<b>' + durs + '</b>（共 ' + total + 's）— 按 → 进入</div>' +
      '</section>';
  }

  function variantHTML(p, qk) {
    var pi = p.n - 1, Q = QUANTS[qk], d = p.data[qk];
    return '<section class="slide vt" data-p="' + p.n + '">' +
      xmarks() +
      '<div class="vnum"><b class="n1">' + PNUM[pi].charAt(0) + '</b><b class="n2">' + PNUM[pi].charAt(1) + '</b><span class="bar"></span></div><div class="dots vt-dots"></div>' +
      '<div class="vt-top"><div class="plate fx"><i></i>项目 ' + PNUM[pi] + ' · ' + p.zh + '</div>' +
        '<div class="vt-tr fx">' + mot(p) + '<div class="qtag"><b>' + Q.name + '</b><span>' + Q.model + ' · ' + Q.sizeGB.toFixed(1) + 'GB</span></div></div></div>' +
      '<div class="tc fx"><span class="rd">REC</span> <span class="dim">·</span> <b>' + qfile(p, qk) + '</b> <span class="dim">·</span> 1280×720 <span class="dim">·</span> H.264 <span class="dim">·</span> 截取 ' + d.cut + ' <span class="dim">·</span> 源 <b>' + d.src + '</b></div>' +
      '<div class="film fx" data-vid>' +
        '<video preload="auto" poster="' + qposter(p, qk) + '" src="' + qpath(p, qk) + '"></video>' +
        '<div class="vph"><div class="vph-t">待 录 制</div><div class="vph-p">' + qpath(p, qk) + '</div><div class="vph-h">将录像放到该路径（VID_ROOT 可改）后刷新页面</div></div>' +
        '<div class="vbtn">全屏播放</div>' +
      '</div>' +
      '<div class="stats fx">' +
        '<div class="st"><i>输入</i><b>' + d.in + '</b></div>' +
        '<div class="st"><i>输出</i><b>' + d.out + '</b></div>' +
        '<div class="st"><i>KV CACHE</i><b>' + d.kv + '</b></div>' +
        '<div class="st"><i>压缩</i><b>' + d.comp + ' 次</b></div>' +
        '<div class="st rec"><i>片长</i><b>' + d.dur + 's</b></div>' +
        '<div class="st"><i>源文件</i><b>' + d.src + '</b></div>' +
      '</div>' +
      '</section>';
  }

  function summaryHTML() {
    var heads = QORDER.map(function (qk) {
      var Q = QUANTS[qk];
      return '<div class="sm-h"><b>' + Q.name + '</b><span>' + Q.model + ' · ' + Q.sizeGB.toFixed(1) + 'GB</span><div class="qb"><i style="width:' + barw(qk) + '"></i></div></div>';
    }).join(NL);
    var body = "";
    PROJECTS.forEach(function (p, pi) {
      body += '<div class="sm-rowlab"><div class="rl"><i class="sq" style="background:' + PHUE[pi] + ';border-color:' + PHUE[pi] + '"></i><b>test0' + p.n + '</b></div><span>' + p.tech + ' · ' + p.form + '</span></div>';
      QORDER.forEach(function (qk) {
        var d = p.data[qk];
        body += '<div class="sm-c" style="--rc:' + PHUE[pi] + '"><img src="' + qposter(p, qk) + '" alt=""><div class="strip"><b class="' + (d.comp > 0 ? "rd" : "") + '">压缩 ' + d.comp + ' 次</b><span>in ' + d.in + ' / out ' + d.out + ' · ' + d.dur + 's</span></div></div>';
      });
    });
    var tot = '<div></div>' + QORDER.map(function (qk) {
      var Q = QUANTS[qk];
      return '<div class="sm-tc"><i>' + Q.name + ' 合计</i><span>输入</span><b>' + Q.tin + '</b><span>输出</span><b class="rd">' + Q.tout + '</b><span>压缩</span><b>' + Q.tcomp + ' 次</b></div>';
    }).join(NL);
    return '<section class="slide sm" data-p="0">' +
      xmarks() +
      '<div class="sm-deco"><div class="dots" style="position:static;width:100%;height:100%"></div><div class="ring" style="position:absolute;right:-1vw;top:-2vh;width:9vh;height:9vh"></div></div>' +
      '<div class="sm-top"><div class="plate fx"><i></i>总结对比 SUMMARY</div><h2 class="fx">三项目 × 三量化</h2></div>' +
      '<div class="sm-grid"><div></div>' + heads + body + tot + '</div>' +
      '<div class="sm-note fx"><span>观察：<b>NVFP4</b> 总输出最高（485.7K）且压缩 3 次仍稳定；<b>Q5</b> 总输入最低（14.8M）；<b>Q4</b> 在 test2 消耗最大（10.2M）。量化档位与场景复杂度共同决定生成行为与压缩触发，完整数据见 $OUTPUT_DIR/规划.txt。</span></div>' +
      '</section>';
  }

  function drumHTML() {
    var faces = OTHER.map(function (o, i) {
      return '<div class="face" style="transform:rotateY(' + (i * 90) + 'deg) translateZ(21vw)">' +
        '<div class="face-frame" data-ox>' +
          '<video muted loop autoplay preload="metadata" src="' + VID_ROOT + o.file + '"></video>' +
          '<div class="face-ph"><div class="fn">0' + (i + 1) + '</div><div class="ft">' + o.t + '</div><div class="fp">' + o.file + '</div><div class="fh">待录制 · 放入同名文件即自动显示</div></div>' +
          '<div class="face-plate"><span><i></i>' + o.t + '</span><span>' + o.file + '</span></div>' +
        '</div></div>';
    }).join(NL);
    return '<section class="slide ox" data-p="0">' +
      xmarks() +
      '<div class="dots" style="left:2vw;bottom:8vh"></div>' +
      '<div class="ox-top"><div class="plate fx"><i></i>其他作品 · OTHER</div><h2 class="fx">滚筒轮播</h2><span class="ox-sub fx">4 PROJECTS · 3D BARREL · LOOP</span>' +
        '<div class="ox-deco fx"><span class="dr f"></span><span class="dr"></span><span class="dr"></span></div></div>' +
      '<div class="drum-stage fx"><div class="drum" id="drum">' + faces + '</div></div>' +
      '<div class="ox-hint fx"><i></i>悬停暂停旋转 · 点击空白翻页 · 视频待录制：把 4 个 mp4 放到 <b>$OUTPUT_DIR/</b> 命名为 other-1..4.mp4，或改脚本顶部 OTHER 数组</div>' +
      '</section>';
  }

  function endHTML() {
    var CREDITS = [
      ["参 演", "Q5_K_XL · Q4_K_XL · NVFP4-MTP-Q8attn", "CAST", true],
      ["网页制作", "Qwen3.8-27B-UD-Q5_K_XL", "WEB BUILD", false],
      ["音 乐", "Qwen3.8-27B-UD-Q5_K_XL", "MUSIC", false],
      ["数据分析 · 技术支持", "Qwen3.8-27B-UD-Q5_K_XL", "DATA & TECH", false],
      ["视频录制", "我", "REC", false],
      ["总体规划", "我", "PLAN", false]
    ];
    var rows = CREDITS.map(function (c) {
      return '<div class="cr fx' + (c[3] ? " big" : "") + '"><i>' + c[0] + '</i><b>' + c[1] + '</b><span class="en">' + c[2] + '</span></div>';
    }).join(NL);
    return '<section class="slide fin" data-p="0">' +
      xmarks() +
      '<div class="fin-deco"></div><div class="fin-deco2"></div><div class="dots fin-dots"></div>' +
      '<div class="fin-l">' +
        '<div class="fin-block fx"><b>完</b></div>' +
        '<div class="fin-plate plate fx"><i></i>THE END · 完</div>' +
        '<div class="fin-line fx"></div>' +
        '<div class="fin-tag fx">QWEN3.8-27B · QUANTIZATION SHOWCASE · 2026</div>' +
      '</div>' +
      '<div class="fin-r">' + rows + '</div>' +
      '<div class="fin-foot fx"><span>按 <b>Home</b> 回到封面</span><span>·</span><span><b>F</b> 全屏</span></div>' +
      '</section>';
  }

  var SLIDES = [];
  function addSlide(html, label, kind) {
    var el = document.createElement("div");
    el.innerHTML = html;
    var s = el.firstElementChild;
    stage.appendChild(s);
    SLIDES.push({ el: s, label: label, kind: kind || "" });
  }
  addSlide(coverHTML(), "封面 · 主题与配置");
  PROJECTS.forEach(function (p, pi) {
    addSlide(headHTML(p), "测试项目" + PNUM[pi] + " · 设定");
    QORDER.forEach(function (qk) {
      addSlide(variantHTML(p, qk), "测试项目" + PNUM[pi] + " · " + QUANTS[qk].name + " 录像");
    });
  });
  addSlide(summaryHTML(), "总结对比");
  addSlide(drumHTML(), "其他作品 · 滚筒轮播", "drum");
  addSlide(endHTML(), "结束 · 鸣谢");

  SLIDES.forEach(function (s) {
    var ph = s.el.querySelector("[data-prompt]");
    if (ph) ph.textContent = document.getElementById("prompt-" + ph.getAttribute("data-prompt")).textContent.trim();
  });

  var idx = 0, busy = false;
  var hudc = document.getElementById("hudc"), idxEl = document.getElementById("idx"),
      prog = document.getElementById("prog").firstElementChild, track = document.getElementById("track");
  for (var t = 0; t < 10; t++) {
    var cell = document.createElement("i");
    cell.style.borderColor = (t < 9) ? PHUE[Math.floor(t / 3)] : "#d93a12";
    cell.style.color = (t < 9) ? PHUE[Math.floor(t / 3)] : "#d93a12";
    track.appendChild(cell);
  }
  var cells = track.children;
  function trackSlide(i) { return i < 9 ? (2 + Math.floor(i / 3) * 4 + (i % 3)) : 14; }

  function showFx(s) {
    var fx = s.el.querySelectorAll(".fx");
    for (var i = 0; i < fx.length; i++) {
      (function (f, i) { setTimeout(function () { f.classList.add("on"); }, 90 + i * 60); })(fx[i], i);
    }
  }
  function hideFx(s) {
    var fx = s.el.querySelectorAll(".fx.on");
    for (var i = 0; i < fx.length; i++) fx[i].classList.remove("on");
  }
  function paint() {
    idxEl.textContent = ("0" + (idx + 1)).slice(-2) + " / 16";
    prog.style.width = ((idx + 1) / 16 * 100) + "%";
    hudc.textContent = SLIDES[idx].label;
    for (var i = 0; i < 10; i++) cells[i].classList.toggle("hit", trackSlide(i) <= idx);
  }

  function slideVideos(s) { return s.el.querySelectorAll("video"); }
  function pauseSlideVideos(s) { var vs = slideVideos(s); for (var i = 0; i < vs.length; i++) vs[i].pause(); }
  function playSlideVideos(s) { var vs = slideVideos(s); for (var i = 0; i < vs.length; i++) vs[i].play().catch(function () {}); }
  function seekVideo(s) {
    if (s.kind === "drum") return;
    var v = s.el.querySelector("video");
    if (v) { try { v.currentTime = 0; } catch (e) {} }
  }

  function slideColor(el) {
    var p = parseInt(el.getAttribute("data-p"), 10);
    return p >= 1 && p <= 3 ? PHUE[p - 1] : INK;
  }
  function go(n) {
    if (busy || n === idx || n < 0 || n >= SLIDES.length) return;
    busy = true;
    var back = n < idx;
    var cur = SLIDES[idx], nxt = SLIDES[n];
    wipe.style.background = slideColor(nxt.el);
    wipe.style.animation = "none";
    void wipe.offsetWidth;
    wipe.style.animation = (back ? "wipeInR " : "wipeIn ") + "0.24s cubic-bezier(.85,0,.15,1) forwards";
    setTimeout(function () {
      pauseSlideVideos(cur);
      hideFx(cur);
      cur.el.classList.remove("on");
      nxt.el.classList.add("on");
      idx = n;
      showFx(nxt);
      paint();
      if (nxt.kind === "drum") playSlideVideos(nxt);
      else seekVideo(nxt);
      wipe.style.animation = (back ? "wipeOutR " : "wipeOut ") + "0.28s cubic-bezier(.85,0,.15,1) forwards";
      setTimeout(function () {
        wipe.style.animation = "none";
        wipe.style.transform = "translateX(-102%)";
        busy = false;
      }, 300);
    }, 250);
  }

  SLIDES.forEach(function (s) {
    var film = s.el.querySelector(".film");
    if (film) {
      var v = film.querySelector("video");
      v.addEventListener("error", function () { film.classList.add("novideo"); });
      film.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (film.classList.contains("novideo")) return;
        if (film.requestFullscreen) film.requestFullscreen();
        v.play().catch(function () {});
      });
      v.addEventListener("ended", function () { if (document.fullscreenElement) document.exitFullscreen(); });
    }
    var ox = s.el.querySelector("[data-ox]");
    if (ox) {
      var ov = ox.querySelector("video");
      ov.addEventListener("canplay", function () { ox.classList.add("ok"); });
    }
  });

  // ===== 音乐 =====
  var bgm = document.getElementById("bgm");
  var mbtn = document.getElementById("mbtn");
  var bgmst = document.getElementById("bgmst");
  var mstate = "auto";
  function paintMusic() {
    mbtn.classList.toggle("on", mstate === "on");
    if (bgmst) bgmst.textContent = mstate === "on" ? "播放中" : (mstate === "off" ? "已关 · M 开启" : "自动 · 任意键开始");
  }
  function setMusic(on) {
    mstate = on ? "on" : "off";
    if (on) bgm.play().catch(function () { mstate = "off"; });
    else bgm.pause();
    paintMusic();
  }
  bgm.addEventListener("play", function () { mstate = "on"; paintMusic(); });
  bgm.addEventListener("pause", function () { if (mstate !== "auto") { mstate = "off"; paintMusic(); } });
  mbtn.addEventListener("click", function (ev) { ev.stopPropagation(); setMusic(mstate !== "on"); });
  var chip = document.getElementById("bgmchip");
  if (chip) chip.addEventListener("click", function (ev) { ev.stopPropagation(); setMusic(mstate !== "on"); });
  paintMusic();
  function firstTouch() { if (mstate === "auto") setMusic(true); }
  document.addEventListener("keydown", firstTouch, true);
  document.addEventListener("pointerdown", firstTouch, true);

  stage.addEventListener("click", function (ev) {
    if (ev.target.closest(".film") || ev.target.closest("#mbtn") || ev.target.closest("#bgmchip")) return;
    go(idx + 1);
  });

  function toggleFS() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") { ev.preventDefault(); go(idx + 1); }
    else if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); go(idx - 1); }
    else if (ev.key === "Home") { ev.preventDefault(); go(0); }
    else if (ev.key === "End") { ev.preventDefault(); go(SLIDES.length - 1); }
    else if (ev.key === "f" || ev.key === "F") { ev.preventDefault(); toggleFS(); }
    else if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); setMusic(mstate !== "on"); }
    else if (ev.key === "0") { ev.preventDefault(); go(14); }
    else if (ev.key >= "1" && ev.key <= "9") {
      var k = parseInt(ev.key, 10) - 1;
      go(2 + Math.floor(k / 3) * 4 + (k % 3));
    }
  });

  window.__dsh_go = go;
  window.__dsh_idx = function () { return idx; };
  SLIDES[0].el.classList.add("on");
  showFx(SLIDES[0]);
  paint();
})();
</script>
</body>
</html>
