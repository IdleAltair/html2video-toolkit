<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计语言选型台 · 7 套模板 × 同一份内容</title>
<!--
  llm-html2video · sample 目录的选型台
  同一页示例内容,7 套设计语言并排渲染,横向比风格。
  双击本文件即可用;要细看某一格点该格的「打开」。
-->
<style>
:root{--bg:#0B0C0E;--fg:#E8ECE9;--dim:#7C8794;--line:#22282F;--acc:#D6FF3F}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:400 15px/1.6 "Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
a{color:#8FC7FF;text-decoration:none}a:hover{text-decoration:underline}
header{padding:22px 28px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
.sub{margin:6px 0 16px;color:var(--dim);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grp{display:flex;gap:6px}
button{background:#16191D;color:var(--fg);border:1px solid var(--line);border-radius:3px;
  padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.on{background:var(--acc);color:#0B0C0E;border-color:var(--acc);font-weight:700}
label{display:inline-flex;gap:7px;align-items:center;color:var(--dim);font-size:14px;cursor:pointer}
label input{accent-color:var(--acc)}
table{border-collapse:collapse;width:100%;max-width:1500px;font-size:13px}
th,td{text-align:left;padding:5px 12px 5px 0;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top}
th{color:var(--fg);font-weight:500;letter-spacing:.06em;font-size:12px}
td.n{color:var(--fg)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));
  gap:16px;padding:18px 28px 34px}
figure{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 12px;border-bottom:1px solid var(--line);background:#101317;font-size:14px}
figcaption b{font-weight:700}
figcaption span{color:var(--dim);font-size:12px;margin-left:auto}
figcaption a{font-size:12px;white-space:nowrap}
iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.hint{color:var(--dim);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>设计语言选型台</h1>
  <div class="sub">同一份示例内容（<code>SHARED DECK v1</code>）在 7 套设计语言下的并排渲染。
    切页码即可横向比风格；每格内部按各自模板的真实版式等比缩放，所以比例、密度、留白都是真的。</div>
  <div class="bar">
    <div class="grp" id="pages"></div>
    <label><input type="checkbox" id="anim"> 带动效（关掉更省，也便于逐格比对静态版式）</label>
    <label><input type="checkbox" id="clean" checked> 录屏态 <code>?clean=1</code></label>
    <label><input type="checkbox" id="grid4"> 每行 4 格</label>
  </div>
  <table id="speed"></table>
  <div class="hint">键盘 <code>←</code> <code>→</code> 切页（焦点在本页时）；点某格的「打开」看该套全尺寸。</div>
</header>
<main id="grid"></main>
<script>
var PLANS=[
  {id:"far-horizon", n:"00", name:"远岸 Far Horizon",   mood:"纪念碑静止 × 机械爆发", bg:"#07090D", hi:"#D6FF3F", fit:"赛事数据、任务日志",        base:"#07090D"},
  {id:"blueprint",   n:"01", name:"蓝图 Blueprint",      mood:"工程制图室",           bg:"#14407A", hi:"#FF4FA3", fit:"架构、流程、技术解析",      base:"#14407A"},
  {id:"swiss-grid",  n:"02", name:"瑞士网格 Swiss Grid", mood:"国际主义排版",         bg:"#FAFAF7", hi:"#E4032E", fit:"观点论述、对比论证",        base:"#FAFAF7"},
  {id:"phosphor",    n:"03", name:"磷光终端 Phosphor",   mood:"琥珀示波器",           bg:"#0A0806", hi:"#FFB000", fit:"终端、代码、日志叙事",      base:"#0A0806"},
  {id:"ukiyo-modern",n:"04", name:"浮世绘现代 Ukiyo",    mood:"和纸版画",             bg:"#F2EAD8", hi:"#C73E2C", fit:"故事、历程、人文叙事",      base:"#F2EAD8"},
  {id:"synthwave",   n:"05", name:"合成波 Synthwave",    mood:"落日铬字",             bg:"#0D0418", hi:"#FF2E88", fit:"音乐向、快节奏蒙太奇",      base:"#0D0418"},
  {id:"white-cube",  n:"06", name:"白盒画廊 White Cube", mood:"美术馆展签",           bg:"#F5F4F0", hi:"#1F4D8F", fit:"深度分析、慢节奏长文",      base:"#F5F4F0"}
];
var PAGES=["1 封面","2 数据页","3 排行页","4 分隔页","5 实录页","6 终场页"];
var page=0;

/* 速查表 */
document.getElementById("speed").innerHTML=
  "<tr><th>#</th><th>方案</th><th>一句话气质</th><th>底色</th><th>高光</th><th>适配内容</th></tr>"+
  PLANS.map(function(p){
    return "<tr><td>"+p.n+'</td><td class="n">'+p.name+"</td><td>"+p.mood+"</td>"+
      '<td><span class="sw" style="background:'+p.bg+';outline:1px solid #333"></span>'+p.bg+"</td>"+
      '<td><span class="sw" style="background:'+p.hi+'"></span>'+p.hi+"</td><td>"+p.fit+"</td></tr>";
  }).join("");

/* 页码按钮 */
var pb=document.getElementById("pages");
PAGES.forEach(function(t,i){
  var b=document.createElement("button");b.textContent=t;b.dataset.p=i;
  b.onclick=function(){set(i)};pb.appendChild(b);
});

/* 格子 */
var grid=document.getElementById("grid"),cells=[];
PLANS.forEach(function(p){
  var f=document.createElement("figure");f.className="cell";
  f.innerHTML='<figcaption><b>'+p.n+" "+p.name+'</b><span>'+p.mood+"</span>"+
    '<a target="_blank" rel="noopener">打开</a></figcaption><iframe loading="lazy" title="'+p.id+'"></iframe>';
  grid.appendChild(f);
  cells.push({plan:p,fig:f,frame:f.querySelector("iframe"),link:f.querySelector("a")});
});

function qs(){
  return "?slide="+page+(document.getElementById("anim").checked?"":"&noanim=1")+
         (document.getElementById("clean").checked?"&clean=1":"");
}
function render(){
  cells.forEach(function(c){
    var q=qs();
    c.frame.src=c.plan.id+".html"+q;
    c.link.setAttribute("href",c.plan.id+".html"+q);
  });
  [].forEach.call(pb.children,function(b,i){b.className=i===page?"on":""});
}
function set(i){page=Math.max(0,Math.min(PAGES.length-1,i));render()}
document.getElementById("anim").onchange=render;
document.getElementById("clean").onchange=render;
document.getElementById("grid4").onchange=function(e){
  grid.style.gridTemplateColumns=e.target.checked?"repeat(4,1fr)":"";
};
addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")set(page+1);
  else if(e.key==="ArrowLeft")set(page-1);
});

render();
</script>
</body>
</html>
