<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远岸 FAR HORIZON · 模板样例 · llm-html2video</title>
<!--
  设计语言 00 远岸 · 单文件模板
  规范源: ../docs/design-language-far-horizon.md   v1.0 2026-10-12
  用法:   far-horizon.html              正常播放(2560x1440 自适应缩放)
          ?noanim          降级:转场 1 帧直切、odometer 直显终值、扫表静态(计时码与 REC 保留)
          ?clean=1         录屏:隐藏鼠标与左下角键位提示条(等价按 F)
          ?slide=3         直接定位到第 4 页
  键位:   → / Space / PageDown 下页   ← / PageUp 上页   Home / End   F 纯净屏   A 切换 ?noanim
-->
<style>
/* ---- 色板 token · 规范 §2.1，逐字照抄 ---- */
:root{
  --abyss:   #07090D;
  --panel:   #0E1319;
  --edge:    #1C242E;
  --bone:    #E8ECE9;
  --dim:     #6E7A86;
  --volt:    #D6FF3F;
  --signal:  #FF5C1F;
  --steel:   #3A4654;
  --m-land:  #7DF0C8;
  --m-bomb:  #FFB13F;
  --m-flag:  #B78CFF;
  --fmono:"Cascadia Code","JetBrains Mono","IBM Plex Mono",Consolas,"NotoSC",monospace;
  --fsans:"Noto Sans SC","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
/* 三场色只染页眉标签、进度条、本场强调元素(§2.2) */
.m1{--cur:var(--m-land)} .m2{--cur:var(--m-bomb)} .m3{--cur:var(--m-flag)}

html,body{margin:0;height:100%;background:#000;overflow:hidden}
html.clean,html.clean *{cursor:none!important}
html.clean #hintbar{display:none}
#stage{position:fixed;left:50%;top:50%;width:2560px;height:1440px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;
  background:var(--abyss);overflow:hidden;font-family:var(--fsans);color:var(--bone)}

/* ---- 母题 1:点阵星野(§4.3,4px 点/64px 间距/--edge/6-10%) ---- */
#stars{position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--edge) 2px,transparent 2.2px);
  background-size:64px 64px;background-position:32px 32px;
  opacity:.06;animation:stardrift 12s ease-in-out infinite}
@keyframes stardrift{0%,100%{opacity:.06}50%{opacity:.10}}

/* ---- 母题 2:地平线(贯穿页面下 1/3 处,1px --edge) ---- */
#horizon{position:absolute;left:0;right:0;top:960px;height:1px;background:var(--edge)}

/* ---- 骨架:起点线(左缘内 96px,2px volt 竖线 + 每 96px 一齿 8px) ---- */
#startline{position:absolute;left:96px;top:96px;height:1248px;width:2px;background:var(--volt);z-index:6}
#startline::after{content:"";position:absolute;left:2px;top:0;width:8px;height:100%;
  background:repeating-linear-gradient(to bottom,var(--volt) 0 2px,transparent 2px 96px)}

/* ---- 骨架:遥测角标(右上常驻,§4.2) ---- */
#telemetry{position:absolute;right:96px;top:96px;z-index:6;
  display:flex;align-items:center;gap:20px;font:400 24px/1 var(--fmono);color:var(--dim);letter-spacing:.04em}
#telemetry .mid{color:var(--bone)}
#telemetry .chip{width:12px;height:12px;background:var(--cur,var(--dim));flex:none}
#telemetry .clk{color:var(--bone);font-variant-numeric:tabular-nums}

/* ---- 骨架:底部计时导航条(高 56px 通栏,volt 填充,§4.2) ---- */
#nav{position:absolute;left:0;bottom:0;width:2560px;height:56px;background:var(--panel);
  border-top:1px solid var(--edge);z-index:6}
#navfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cur,var(--volt));
  transition:width 320ms cubic-bezier(.16,1,.3,1)}
#navticks{position:absolute;left:0;top:0;height:100%}
#navticks i{position:absolute;top:0;width:2px;height:100%;background:var(--abyss)}
#navticks i.on{background:var(--bone);animation:pulseonce 400ms steps(2,end) 1}
@keyframes pulseonce{0%{height:100%}50%{height:34%}100%{height:100%}}

/* ---- 页容器 ---- */
#slides{position:absolute;inset:0;z-index:3}
.slide{position:absolute;inset:96px;opacity:0;visibility:hidden;will-change:transform,opacity}
.slide.cur{opacity:1;visibility:visible}

/* ---- 通用排版(字号阶梯 §3.2) ---- */
.kicker{font:400 26px/1.4 var(--fmono);letter-spacing:.22em;color:var(--dim)}
h1.page{margin:0;font:900 84px/1.12 var(--fsans);letter-spacing:-.02em;color:var(--bone)}
h1.page .neg{color:var(--signal)}
h1.page .em{color:var(--volt)}
.lede{font:500 34px/1.7 var(--fsans);color:var(--bone);max-width:1000px}
.note{font:400 26px/1.6 var(--fsans);color:var(--dim)}
.hero{position:relative;font:400 200px/1 var(--fmono);letter-spacing:-.02em;color:var(--volt);
  font-variant-numeric:tabular-nums}
.hero.neg{color:var(--signal)}
.hero .unit{font-size:56px;color:var(--dim);letter-spacing:.1em;margin-left:14px}
.hero .burst{position:absolute;left:50%;top:50%;width:800px;height:800px;margin:-400px 0 0 -400px;
  background-image:radial-gradient(circle,var(--edge) 2px,transparent 2.2px);
  background-size:64px 64px;opacity:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle,#000 0 260px,transparent 400px);
          mask-image:radial-gradient(circle,#000 0 260px,transparent 400px)}
.hero .burst.lit{animation:burst 600ms linear 1}
.hero .burst.lit.neg{background-image:radial-gradient(circle,var(--signal) 2px,transparent 2.2px)}
@keyframes burst{0%{opacity:0}30%{opacity:.25}100%{opacity:0}}

/* ---- 表格(§5:无框线，行分隔 1px --edge，等宽数字右对齐) ---- */
table.tele{border-collapse:collapse;width:100%}
table.tele th{font:400 24px/1 var(--fmono);letter-spacing:.12em;color:var(--dim);text-align:right;
  padding:0 0 14px;border-bottom:1px solid var(--edge)}
table.tele th:first-child{text-align:left}
table.tele td{font:400 28px/1 var(--fmono);color:var(--bone);text-align:right;
  padding:20px 0;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums}
table.tele td:first-child{text-align:left;font-family:var(--fsans);color:var(--dim);font-size:28px}
table.tele td.volt{color:var(--volt)} table.tele td.neg{color:var(--signal)}

/* ---- 条形图(§5 排行/比分:水平条 + 0 基线) ---- */
.chart{position:relative}
.chart .row{position:relative;height:86px;margin-bottom:22px}
.chart .rname{position:absolute;left:0;top:0;width:280px;font:400 28px/86px var(--fsans);color:var(--dim)}
.chart .rname.local{color:var(--bone);font-weight:700}
.chart .track{position:absolute;left:300px;right:190px;top:19px;height:48px}
.chart .bar{position:absolute;top:0;height:100%;background:var(--steel);width:0}
.chart .bar.cloud{background:var(--bone)}
.chart .bar.local{background:var(--signal)}
.chart .bar.neg{background:var(--signal)}
.chart .val{position:absolute;right:0;top:0;width:170px;font:400 34px/48px var(--fmono);
  text-align:right;color:var(--bone);font-variant-numeric:tabular-nums}
.chart .val.neg{color:var(--signal)}
.chart .base0{position:absolute;top:-14px;bottom:-14px;width:1px;background:var(--bone);opacity:0}
.chart .base0.lit{opacity:1}
.chart .base0.blink{animation:baseblink 200ms steps(1,end) 2}
@keyframes baseblink{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.chart .head{position:absolute;top:-14px;bottom:-14px;width:4px;background:var(--volt);left:0;opacity:0}
.chart .head.mv{opacity:1}

/* ---- 实录窗(§6:2px --edge 描边，无圆角;REC 角标外挂) ---- */
.recwin{position:relative;border:2px solid var(--edge);background:var(--panel);padding:40px 44px}
.reclip{position:absolute;right:-2px;top:-34px;font:400 24px/1 var(--fmono);color:var(--dim);letter-spacing:.1em}
.reclip i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--signal);
  margin-right:10px;vertical-align:-1px;animation:recblink 1s steps(1,end) infinite}
@keyframes recblink{0%,50%{opacity:1}50.1%,100%{opacity:.15}}
.recline{display:flex;gap:28px;font:400 28px/1.9 var(--fmono);color:var(--bone)}
.recline t{color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.recline .sys{color:var(--dim)} .recline .out{color:var(--bone)}

/* ---- 段落分隔页(整页只留段落名) ---- */
.divider{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:200px}
.divider .dname{font:900 140px/1.1 var(--fsans);letter-spacing:-.02em;color:var(--bone)}
.divider .dsub{margin-top:34px;font:400 34px/1 var(--fmono);letter-spacing:.2em;color:var(--cur)}

/* ---- 结束页 ---- */
.final .close{font:900 96px/1.2 var(--fsans);letter-spacing:-.02em;color:var(--bone);max-width:1400px}
.final .endclk{margin-top:60px;font:400 40px/1 var(--fmono);color:var(--dim);letter-spacing:.1em}
.final .endclk b{color:var(--bone);font-weight:400}

/* ---- 转场层 ---- */
#wipe,#shutter,#scan,#blackout{position:absolute;inset:0;z-index:20;pointer-events:none}
#wipe{display:none;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
#wipe.on{display:grid}
#wipe i{transform:scale(0);background:var(--bone)}
#wipe i.b{background:var(--panel)}
#shutter{display:none}
#shutter.on{display:block}
#shutter b{position:absolute;left:0;width:100%;height:0;background:var(--panel);display:block}
#shutter b.t{top:0} #shutter b.k{bottom:0}
#scan{opacity:0;background:linear-gradient(90deg,transparent,var(--volt) 50%,transparent);width:120px;left:0}
#scan.on{opacity:1}
#blackout{background:#000;opacity:0;transition:opacity 400ms linear;z-index:30}

/* ---- 键位提示条(?clean 隐藏，非录屏内容) ---- */
#hintbar{position:absolute;left:96px;bottom:88px;z-index:8;
  font:400 24px/1 var(--fmono);letter-spacing:.1em;color:var(--dim)}

/* ---- ?noanim 降级(§7.6:转场 1 帧直切;呼吸与计时码保留) ---- */
html.noanim .slide{transition:none!important}
html.noanim #navfill{transition:none}
html.noanim .hero .burst.lit,html.noanim .chart .base0.blink,html.noanim #navticks i.on{animation:none}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="horizon"></div>
  <div id="slides"></div>
  <div id="startline"></div>
  <div id="telemetry"></div>
  <div id="nav"><div id="navfill"></div><div id="navticks"></div></div>
  <div id="wipe"></div>
  <div id="shutter"><b class="t"></b><b class="k"></b></div>
  <div id="scan"></div>
  <div id="hintbar"></div>
  <div id="blackout"></div>
</div>
<script>
(function(){
'use strict';

/* ============================================================
   SHARED DECK v1 · 示例内容(7 套设计语言模板必须逐字一致)
   数字为模板占位示例，非实测成绩;替换本块即可套真实内容。
   ============================================================ */
var DECK={
  meta:{style:"",doc:"",
        ver:"TEMPLATE v1 · 2026-10-17",total:"00:42:15"},
  slides:[
    {type:"cover",mission:0,
      kicker:"TELEMETRY ARCHIVE · 2026-10-17",
      title:"本地 27B 的三场任务",
      lede:"三场任务跑完，名次停在第 15。",
      stats:[["任务","3 场"],["参赛","15 队"],["页面","27 页"],["时长","42:15"]]},

    {type:"metric",mission:2,mid:"M2",name:"炸弹人",
      conclusion:{pre:"翻盘发生在第 12 分钟",verb:"变",a:"−346",b:"−52"},
      hero:{value:-52,unit:"分",neg:true},
      note:"一次回防把分差从 346 压回 52，本场净负 52。",
      rows:[["M1 圈地","+1,842","volt"],["M2 炸弹人","−52","neg"],
            ["M3 夺旗","6:4",""],["累计 token","27,318",""]]},

    {type:"ranking",mission:1,mid:"M1",name:"圈地",
      title:"占地率终榜 · 本机排第二",
      domain:[-400,2600],
      bars:[{n:"云端旗舰",v:2480,role:"cloud"},
            {n:"本地 27B",v:1842,role:"local"},
            {n:"对手 K-09",v:910,role:"rival"},
            {n:"对手 R-03",v:186,role:"rival"},
            {n:"对手 X-21",v:-260,role:"neg"}],
      note:"数值以文字标注在条端；基线为 0，负值向左。"},

    {type:"divider",mission:3,mid:"M3",name:"夺旗",sub:"SECTION 03 · 6:4 收台"},

    {type:"transcript",mission:3,mid:"M3",name:"夺旗",
      title:"实录 · 最后一次进攻",
      lines:[["00:37:02","sys","<system> 敌旗在 (14,9)，最近路径被两个箱子堵死"],
             ["00:37:09","out","先把左箱推到 (12,7)，腾出走道"],
             ["00:37:21","out","绕下路，顺手把右箱拖到旗点前"],
             ["00:37:34","sys","<system> 你被正面撞见，损失 1 回合"],
             ["00:37:40","out","不追了，退到旗点另一侧卡住"],
             ["00:38:05","out","举旗，原路撤"]],
      counter:{label:"已耗 token",value:27318,unit:"tok"},
      note:"失误照实标注，不避讳失败。"},

    {type:"final",mission:3,mid:"M3",
      close:"三场都跑完了。名次不是结论，日志才是。",
      credits:[["任务","圈地 / 炸弹人 / 夺旗"],["本机","本地 27B · Q5_K_XL"],
               ["页面","27 页 · 单文件 HTML"],["录制","2560×1440@60 实机"]],
      total:"00:42:15"}
  ]
};
/* ======================= SHARED DECK 结束 ==================== */
/* ---- 方案身份:不属于共享内容契约,各套自行声明 ---- */
DECK.meta.style="00 FAR HORIZON"; DECK.meta.doc="design-language-far-horizon.md";
/* ======================= SHARED DECK 结束 ==================== */

var T={whip:320,checker:500,shutter:240,odo:600,sweep:700,cascade:60,black:2000};
var P=new URLSearchParams(location.search);
var NOANIM=P.has("noanim")||P.has("still");
var stage=document.getElementById("stage");
var slidesEl=document.getElementById("slides");
var tele=document.getElementById("telemetry");
var navfill=document.getElementById("navfill"),navticks=document.getElementById("navticks");
var wipe=document.getElementById("wipe"),shutEl=document.getElementById("shutter");
var scan=document.getElementById("scan"),blackout=document.getElementById("blackout");
var hint=document.getElementById("hintbar");
var clockStart=Date.now(),cur=0,finished=false,busy=0,wheelAcc=0;

if(NOANIM)document.documentElement.classList.add("noanim");
if(P.has("clean"))document.documentElement.classList.add("clean");

/* ---------- 格式化 ---------- */
function fmt(n){var s=Math.abs(Math.round(n)).toString(),o="",c=0;
  for(var i=s.length-1;i>=0;i--){o=s[i]+o;if((++c)%3===0&&i>0)o=","+o;}
  return (n<0?"−":"")+o;}
function pad2(v){return (v<10?"0":"")+v;}

/* ---------- 遥测角标 + 走时计时码(§7.5 保留) ---------- */
function tickClock(){
  var s=Math.floor((Date.now()-clockStart)/1000);
  return pad2(Math.floor(s/3600))+":"+pad2(Math.floor(s/60)%60)+":"+pad2(s%60);
}
function renderTelemetry(sl){
  stage.className=sl.mission?"m"+sl.mission:"";   /* --cur 挂 stage:角标色块、进度条、分隔页副标共用 */
  tele.innerHTML=sl.mission
    ?'<span class="mid">'+sl.mid+'</span><span class="chip"></span><span class="clk">'+tickClock()+'</span>'
    :'<span class="clk">'+tickClock()+'</span>';
}
setInterval(function(){var c=tele.querySelector(".clk");if(c)c.textContent=finished?DECK.meta.total:tickClock();},1000);

/* ---------- 底部导航条:每页一齿，当前段脉冲后常亮 ---------- */
(function buildTicks(){
  var n=DECK.slides.length,w=2560/n,i;
  for(i=0;i<n;i++){var t=document.createElement("i");
    t.style.left=(i*w)+"px";t.dataset.i=i;navticks.appendChild(t);}
})();
function renderNav(){
  var n=DECK.slides.length;
  navfill.style.width=((cur+1)/n*100)+"%";
  var ts=navticks.children;
  for(var i=0;i<ts.length;i++)ts[i].className=(i<=cur)?"on":"";
}

/* ---------- 页渲染 ---------- */
function build(sl){
  var d=document.createElement("div");
  d.className="slide"+(sl.mission?" m"+sl.mission:"");
  if(sl.type==="cover")cover(d,sl);
  else if(sl.type==="metric")metric(d,sl);
  else if(sl.type==="ranking")ranking(d,sl);
  else if(sl.type==="divider")divider(d,sl);
  else if(sl.type==="transcript")transcript(d,sl);
  else final(d,sl);
  return d;
}

function cover(d,s){
  d.innerHTML='<div style="position:absolute;left:104px;top:250px">'+
    '<div class="kicker in">'+esc(s.kicker)+'</div>'+
    '<h1 class="page in" style="font-size:150px;margin-top:34px">'+esc(s.title)+'</h1>'+
    '<div class="lede in" style="margin-top:44px">'+esc(s.lede)+'</div>'+
    '<div class="in" style="margin-top:96px">'+s.stats.map(function(k){
        return '<div style="display:flex;gap:28px;height:46px;align-items:baseline">'+
          '<span style="font:400 26px/1 var(--fmono);letter-spacing:.14em;color:var(--dim);width:200px">'+esc(k[0])+'</span>'+
          '<span style="font:400 40px/1 var(--fmono);color:var(--bone);font-variant-numeric:tabular-nums">'+esc(k[1])+'</span></div>';
      }).join("")+'</div></div>';
  d._enter=function(r){cascade(r,0);};
}

function metric(d,s){
  var c=s.conclusion;
  d.innerHTML='<div style="position:absolute;left:104px;top:150px;width:1460px">'+
    '<div class="kicker">'+s.mid+' · '+esc(s.name)+' · 结论</div>'+
    '<h1 class="page" style="margin-top:26px">'+esc(c.pre)+'：'+
      '<span class="neg">'+esc(c.a)+'</span> '+esc(c.verb)+' <span class="neg">'+esc(c.b)+'</span></h1>'+
    '<div class="hero neg" style="margin-top:110px" id="hero"><span class="burst"></span>'+
      '<span class="num">0</span><span class="unit">'+esc(s.hero.unit)+'</span></div>'+
    '<div class="note" style="margin-top:56px;max-width:1200px">'+esc(s.note)+'</div></div>'+
    '<div style="position:absolute;right:0;top:150px;width:640px">'+
    '<table class="tele"><thead><tr><th>任务</th><th>结果</th></tr></thead><tbody>'+
      s.rows.map(function(r){return '<tr class="in"><td>'+esc(r[0])+'</td><td class="'+r[2]+'">'+esc(r[1])+'</td></tr>';}).join("")+
    '</tbody></table></div>';
  d._enter=function(r){
    var h=r.querySelector("#hero .num"),b=r.querySelector(".burst");
    odometer(h,s.hero.value,function(){
      b.classList.add("lit");setTimeout(function(){b.classList.remove("lit");},700);
    });
    cascade(r.querySelector("table"),200);
  };
}

function ranking(d,s){
  var lo=s.domain[0],hi=s.domain[1],rows=s.bars.map(function(b,i){
    return '<div class="row"><div class="rname'+(b.role==="local"?" local":"")+'">'+esc(b.n)+'</div>'+
      '<div class="track" data-i="'+i+'"><div class="base0"></div>'+
      '<div class="bar'+(b.role==="cloud"?" cloud":b.role==="local"?" local":b.role==="neg"?" neg":"")+'" data-v="'+b.v+'"></div>'+
      '<div class="head"></div></div>'+
      '<div class="val'+(b.v<0?" neg":"")+'">'+fmt(b.v)+'</div></div>';
  }).join("");
  d.innerHTML='<div style="position:absolute;left:104px;top:130px;width:1900px">'+
    '<div class="kicker">'+s.mid+' · '+esc(s.name)+'</div>'+
    '<h1 class="page" style="font-size:72px;margin-top:22px">'+esc(s.title)+'</h1>'+
    '<div class="chart" style="margin-top:70px">'+rows+'</div>'+
    '<div class="note" style="margin-top:40px">'+esc(s.note)+'</div></div>';
  d._enter=function(r){sweep(r,s);};
}

function divider(d,s){
  d.innerHTML='<div class="divider"><div class="dname">'+esc(s.name)+'</div>'+
    '<div class="dsub">'+esc(s.sub)+'</div></div>';
  d._enter=function(){};
}

function transcript(d,s){
  d.innerHTML='<div style="position:absolute;left:104px;top:130px;width:1520px">'+
    '<div class="kicker">'+s.mid+' · '+esc(s.name)+'</div>'+
    '<h1 class="page" style="font-size:64px;margin-top:22px">'+esc(s.title)+'</h1>'+
    '<div class="recwin" style="margin-top:56px"><div class="reclip"><i></i>REC</div>'+
      s.lines.map(function(l){return '<div class="recline in"><t>'+esc(l[0])+'</t>'+
        '<span class="'+l[1]+'">'+esc(l[2])+'</span></div>';}).join("")+
    '</div><div class="note" style="margin-top:36px">'+esc(s.note)+'</div></div>'+
    '<div style="position:absolute;right:0;top:130px;width:520px">'+
      '<div class="kicker">'+esc(s.counter.label)+'</div>'+
      '<div class="hero" style="font-size:120px;margin-top:24px"><span class="num">0</span>'+
      '<span class="unit">'+esc(s.counter.unit)+'</span></div></div>';
  d._enter=function(r){
    odometer(r.querySelector(".hero .num"),s.counter.value,null);
    cascade(r.querySelector(".recwin"),240);
  };
}

function final(d,s){
  d.innerHTML='<div class="final" style="position:absolute;inset:0;padding-left:104px">'+
    '<div class="kicker in">END OF ARCHIVE · '+DECK.meta.style+'</div>'+
    '<div class="close in" style="margin-top:40px">'+esc(s.close)+'</div>'+
    '<div style="margin-top:80px;width:1400px">'+s.credits.map(function(k){
      return '<div class="in" style="display:flex;justify-content:space-between;'+
        'border-bottom:1px solid var(--edge);padding:18px 0">'+
        '<span style="font:400 26px/1 var(--fmono);letter-spacing:.12em;color:var(--dim)">'+esc(k[0])+'</span>'+
        '<span style="font:400 28px/1 var(--fmono);color:var(--bone)">'+esc(k[1])+'</span></div>';
    }).join("")+'</div>'+
    '<div class="endclk">TOTAL <b>'+esc(s.total)+'</b></div></div>';
  d._enter=function(r){
    cascade(r,0);
    var items=Array.prototype.slice.call(r.querySelectorAll(".in,.endclk"));
    d._items=items;d._seq=[];
    d._seq.push(setTimeout(function(){
      for(var i=0;i<items.length;i++)(function(el,k){
        d._seq.push(setTimeout(function(){
          el.style.transition="opacity 120ms linear";el.style.opacity="0";},k*90));
      })(items[i],i);
      d._seq.push(setTimeout(function(){
        finished=true;blackout.style.opacity="1";},items.length*90+T.black));
    },2600));
  };
  d._reset=function(){                       /* 定格被解除时还原,并允许下次进入重播终场 */
    (d._seq||[]).forEach(clearTimeout);d._seq=[];
    (d._items||[]).forEach(function(el){el.style.transition="none";el.style.opacity="";});
    d._seen=0;
  };
}

/* ---------- 动效原语 ---------- */
/* 级联进场:逐项延迟 60ms，最多 6 项，超出整体同入(§7.1) */
function cascade(root,delay){
  if(NOANIM)return;
  var els=Array.prototype.slice.call(root.querySelectorAll(".in")).slice(0,6);
  if(!els.length&&root.classList&&root.classList.contains("in"))els=[root];
  els.forEach(function(el,i){
    el.style.opacity="0";el.style.transform="translateY(14px)";
    setTimeout(function(){
      el.style.transition="opacity 300ms cubic-bezier(.16,1,.3,1),transform 300ms cubic-bezier(.16,1,.3,1)";
      el.style.opacity="1";el.style.transform="translateY(0)";
    },(delay||0)+i*T.cascade);
  });
}

/* 签名动效:odometer(§7.2) 600ms 线性，末两位 steps(1) 80ms 卡顿 */
function odometer(el,target,done){
  if(!el)return;
  if(NOANIM){el.textContent=fmt(target);if(done)done();return;}
  var t0=performance.now(),split=T.odo-80;
  function step(now){
    var e=now-t0;
    if(e<split){
      el.textContent=fmt(target*(e/T.odo));
      requestAnimationFrame(step);
    }else if(e<T.odo){
      el.textContent=fmt(target);                 // 末两位机械跳
      setTimeout(function(){el.textContent=fmt(target);if(done)done();},T.odo-e);
    }else{el.textContent=fmt(target);if(done)done();}
  }
  requestAnimationFrame(step);
}

/* 图表动效:扫表(§7.4) 基线先闪 2 次再常亮、且早于数据条 200ms;volt 头 700ms 线性扫过，条跟随落定 */
function sweep(root,s){
  var rows=Array.prototype.slice.call(root.querySelectorAll(".row"));
  var lo=s.domain[0],hi=s.domain[1];
  if(NOANIM){
    rows.forEach(function(r){
      place(r,lo,hi,1);
      r.querySelector(".base0").classList.add("lit");});
    return;
  }
  rows.forEach(function(r){r.querySelector(".base0").classList.add("blink");});
  setTimeout(function(){rows.forEach(function(r){
    r.querySelector(".base0").classList.remove("blink");
    r.querySelector(".base0").classList.add("lit");
  });},400);
  var t0=performance.now()+600;                      // 基线 400ms 闪亮 + 早于数据条 200ms
  function step(now){
    var p=Math.max(0,(now-t0)/T.sweep);if(p>=1)p=1;
    rows.forEach(function(r){
      var tr=r.querySelector(".track"),b=s.bars[+tr.dataset.i];
      place(r,lo,hi,p);
      var h=r.querySelector(".head");
      h.classList.add("mv");h.style.left=(p*100)+"%";
      if(b.role==="local"&&p===1&&!tr.dataset.pulsed){
        tr.dataset.pulsed="1";pulse(r.querySelector(".bar"));}
    });
    if(p<1)requestAnimationFrame(step);
    else rows.forEach(function(r){r.querySelector(".head").classList.remove("mv");});
  }
  requestAnimationFrame(step);
}
/* 条区间 [L,R] 为 track 归一坐标;扫描头走到 p，只揭示 p 左侧的部分 */
function place(r,lo,hi,p){
  var range=hi-lo,x0=-lo/range,bar=r.querySelector(".bar"),v=+bar.dataset.v;
  var L=x0-Math.max(0,-v)/range,R=x0+Math.max(0,v)/range,w=R-L;
  r.querySelector(".base0").style.left=(x0*100)+"%";
  bar.style.left=(L*100)+"%";
  bar.style.width=(Math.max(0,Math.min(w,p-L))*100)+"%";
}
function pulse(bar){                    // 本机条落定后 signal 呼吸 2 次(400ms×2)即止
  bar.style.transition="filter 400ms linear";
  var n=0;(function go(){ if(n++>=2)return;
    bar.style.filter="brightness(1.6)";
    setTimeout(function(){bar.style.filter="";},400);
    setTimeout(go,800);})();
}

/* ---------- 转场(§7.3 白名单三种) ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function show(i,instant){
  var el=nodes[i];
  el.classList.add("cur");
  renderTelemetry(DECK.slides[i]);
  renderNav();
  if(el._enter&&!el._seen){el._seen=1;el._enter(el);}
  if(instant)el.style.transform="";
}
function hide(i){nodes[i].classList.remove("cur");}

function transition(from,to,kind,dir){
  if(NOANIM||kind==="cut"){hide(from);show(to,1);return;}
  if(kind==="checker")return checker(from,to);
  if(kind==="shutter")return shutter(from,to);
  whip(from,to,dir);
}
function whip(from,to,dir){                    // 320ms:旧页移出 60px + 1 帧 volt 扫描线，新页反向 40px
  var a=nodes[from],b=nodes[to];
  a.style.transition="transform "+T.whip+"ms cubic-bezier(.16,1,.3,1),opacity "+T.whip+"ms linear";
  a.style.transform="translateX("+(-60*dir)+"px)";a.style.opacity="0";
  b.style.transform="translateX("+(40*dir)+"px)";b.style.opacity="0";b.classList.add("cur");
  renderTelemetry(DECK.slides[to]);renderNav();
  scan.style.left="0";scan.classList.add("on");
  setTimeout(function(){scan.classList.remove("on");},1000/60);
  requestAnimationFrame(function(){
    b.style.transition="transform "+T.whip+"ms cubic-bezier(.16,1,.3,1),opacity "+T.whip+"ms linear";
    b.style.transform="translateX(0)";b.style.opacity="1";});
  setTimeout(function(){
    a.classList.remove("cur");a.style.transition="";a.style.opacity="1";a.style.transform="";
    b.style.transition="";
    if(!b._seen){b._seen=1;b._enter(b);}
  },T.whip);
}
function checker(from,to){                     // 500ms:8×8 黑白 checker 对角线逐格覆盖再揭开
  wipe.innerHTML="";
  var cells=[],i;
  for(i=0;i<64;i++){var c=document.createElement("i");
    if(((i%8)+Math.floor(i/8))%2)c.className="b";
    wipe.appendChild(c);cells.push(c);}
  wipe.classList.add("on");
  var span=T.checker*0.5,dur=90,stag=(span-dur)/14;
  requestAnimationFrame(function(){
    cells.forEach(function(c,k){
      c.style.transition="transform "+dur+"ms linear";
      c.style.transitionDelay=(((k%8)+Math.floor(k/8))*stag)+"ms";
      c.style.transform="scale(1)";});
  });
  setTimeout(function(){hide(from);show(to,1);
    cells.forEach(function(c,k){
      c.style.transitionDelay=((7-k%8+Math.floor(k/8))*stag)+"ms";
      c.style.transform="scale(0)";});
  },span);
  setTimeout(function(){wipe.classList.remove("on");wipe.innerHTML="";},T.checker+80);
}
function shutter(from,to){                     // 240ms:上下墨黑板夹合夹开
  var t=shutEl.children[0],k=shutEl.children[1];
  shutEl.classList.add("on");
  t.style.transition=k.style.transition="height "+(T.shutter/2)+"ms linear";
  t.style.height=k.style.height="50%";
  setTimeout(function(){hide(from);show(to,1);t.style.height=k.style.height="0";},T.shutter/2);
  setTimeout(function(){shutEl.classList.remove("on");},T.shutter);
}

/* ---------- 页序与转场选择 ---------- */
function kindOf(from,to){
  var a=DECK.slides[from],b=DECK.slides[to];
  if(b.type==="divider"||a.type==="final"||b.type==="final")return "checker";
  if(a.mission&&a.mission===b.mission)return "shutter";
  return "whip";
}
/* 解除终场定格:任何翻页输入都还原断电熄灭的元素,并允许重播终场序列 */
function unblack(){
  var f=nodes[nodes.length-1];
  if(f._reset)f._reset();
  blackout.style.opacity="0";finished=false;
}
function go(to,dir){
  to=Math.max(0,Math.min(DECK.slides.length-1,to));
  if(busy)return;
  if(to===cur){if(blackout.style.opacity==="1")unblack();return;}
  unblack();
  var kind=kindOf(cur,to);
  if(!NOANIM){busy=1;setTimeout(function(){busy=0;},(T[kind]||T.whip)+30);}
  transition(cur,to,kind,dir||(to>cur?1:-1));
  cur=to;hint.textContent=keys();
}
function keys(){return (cur+1)+" / "+DECK.slides.length+
  "   ·   → 下一页   ← 上一页   滚轮   点两侧翻页   Home / End   F 纯净屏"+(NOANIM?"   A 开启动效":"   A 降级 noanim");}

/* ---------- 装配 ---------- */
var nodes=DECK.slides.map(function(s){
  var el=build(s);slidesEl.appendChild(el);return el;});
var jump=P.has("slide")?parseInt(P.get("slide"),10):0;
cur=isNaN(jump)?0:Math.max(0,Math.min(DECK.slides.length-1,jump));
show(cur);
hint.textContent=keys();

/* 鼠标翻页:滚轮累计过阈值才翻(触控板惯性滚动不连跳);点击左右两侧,中间 44% 留作安全区 */
addEventListener("wheel",function(e){
  if(busy){wheelAcc=0;return;}
  wheelAcc+=e.deltaY||e.detail||0;
  if(Math.abs(wheelAcc)<40)return;
  var d=wheelAcc>0?1:-1;wheelAcc=0;go(cur+d,d);
},{passive:true});
stage.addEventListener("click",function(e){
  var x=e.clientX/innerWidth;
  if(x<0.28)go(cur-1,-1);else if(x>0.72)go(cur+1,1);
});

addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowRight"||k==="PageDown"||k===" "){e.preventDefault();go(cur+1,1);}
  else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1,-1);}
  else if(k==="Home")go(0,-1);
  else if(k==="End")go(DECK.slides.length-1,1);
  else if(k==="f"||k==="F")document.documentElement.classList.toggle("clean");
  else if(k==="a"||k==="A")location.search=NOANIM?"":"noanim=1";
});

function fit(){stage.style.setProperty("--s",Math.min(innerWidth/2560,innerHeight/1440));}
addEventListener("resize",fit);fit();
window.__ready=true;                 // 供截图/录屏脚本判活
})();
</script>
